  /* ==================================================================
   * 五、世界书概率（红黄绿灯）
   * ================================================================== */
  async function openLoreProb() {
    var id = chatId();
    if (!id) return;
    var chat = await CV.db.get('chats', id);
    if (!chat) return;
    var lore = chat.lore || [];
    var s = sheet('世界书 · 触发概率', '');
    function light(p) {
      if (p >= 100) return { c: '#3ecf8e', t: '必中' };
      if (p >= 60) return { c: '#c9d84a', t: '容易' };
      if (p >= 30) return { c: '#f5a524', t: '偶尔' };
      return { c: '#f04d5e', t: '罕见' };
    }
    function paint() {
      if (!lore.length) { s.body.innerHTML = '<div class="cv-empty">这个对话没有世界书条目</div>'; return; }
      s.body.innerHTML = '<div class="cv-note">概率决定关键词命中后，这条内容被带进提示词的机会。绿→红表示从必中到罕见。</div>' +
        lore.map(function (e, i) {
          var p = e.probability == null ? 100 : Number(e.probability);
          var L = light(p);
          return '<div class="cv-lore-row">' +
            '<i class="cv-lore-dot" style="background:' + L.c + '"></i>' +
            '<div class="cv-lore-main"><b>' + esc((e.keys || []).join('、') || '无关键词') + '</b>' +
            '<span>' + esc(String(e.content || '').slice(0, 40)) + '</span></div>' +
            '<input type="range" min="0" max="100" step="5" value="' + p + '" data-pr="' + i + '" style="width:90px">' +
            '<span class="cv-lore-val" data-pv="' + i + '">' + p + '%</span>' +
            '</div>';
        }).join('');
      $$('[data-pr]', s.body).forEach(function (r) {
        r.oninput = function () {
          var i = Number(r.getAttribute('data-pr'));
          lore[i].probability = Number(r.value);
          var L = light(Number(r.value));
          s.body.querySelector('[data-pv="' + i + '"]').textContent = r.value + '%';
          var dot = s.body.querySelectorAll('.cv-lore-dot')[i];
          if (dot) dot.style.background = L.c;
        };
        r.onchange = async function () {
          chat.lore = lore;
          await CV.db.put('chats', chat);
        };
      });
    }
    paint();
  }

  async function openCastEditor() {
    var id = chatId();
    if (!id) return;
    var chat = await CV.db.get('chats', id);
    if (!chat) return;
    var role = chat.cast && chat.cast[0];
    var s = sheet('编辑设定', '' +
      '<div class="cv-label">标题</div><input class="input" id="cvT" value="' + esc(chat.title || '') + '">' +
      '<div class="cv-label">开场白</div><textarea class="textarea" id="cvG" rows="3">' + esc((role && role.greeting) || '') + '</textarea>' +
      '<div class="cv-label">角色设定 / 场景</div><textarea class="textarea" id="cvD" rows="5">' + esc((role && (role.scenario || role.desc)) || '') + '</textarea>' +
      '<div class="cv-label">我的设定（这个对话）</div><textarea class="textarea" id="cvU" rows="3">' + esc(chat.userPersona || '') + '</textarea>' +
      '<div class="sheet foot"><button class="btn ghost" id="cvC">取消</button><button class="btn primary" id="cvS">保存</button></div>');
    s.body.querySelector('#cvC').onclick = s.close;
    s.body.querySelector('#cvS').onclick = async function () {
      chat.title = s.body.querySelector('#cvT').value.trim() || chat.title;
      chat.userPersona = s.body.querySelector('#cvU').value.trim();
      if (role) {
        role.greeting = s.body.querySelector('#cvG').value.trim();
        var d = s.body.querySelector('#cvD').value.trim();
        role.scenario = d;
        if (chat.cast.length === 1) role.desc = d;
        await CV.db.put('chars', role);
      }
      chat.updatedAt = Date.now();
      await CV.db.put('chats', chat);
      s.close();
      toast('已保存');
      CV.ui.route('chat/' + id);
    };
  }

    var c = cfg();
    var s = sheet('楼层渲染', '' +
      '<div class="cv-note">把 AI 回复里的 HTML / 占位符 / 变量 / 图片，按角色卡模板渲染成卡片。只渲染最近几条，早的保持纯文本。</div>' +
      '<label class="cv-check"><input type="checkbox" id="cvFOn"' + (c.on ? ' checked' : '') + '> 启用楼层渲染</label>' +
      '<div class="cv-label">渲染最近几层</div>' +
      '<input type="range" id="cvFDepth" min="1" max="20" step="1" value="' + c.depth + '">' +
      '<div class="cv-dim" id="cvFDepthV">' + c.depth + ' 层</div>' +
      '<label class="cv-check"><input type="checkbox" id="cvFImm"' + (c.immersive ? ' checked' : '') + '> 沉浸式（卡片占满宽度，去掉普通气泡）</label>' +
      '<div class="cv-label">模板（留空用角色卡自带的 theme.html）</div>' +
      '<textarea class="textarea" id="cvFTpl" rows="5">' + esc(c.template || '') + '</textarea>' +
      '<div class="cv-note">可用：{{message}} {{name}} {{role}} {{getvar::变量名}}</div>' +
      '<div class="sheet foot"><button class="btn ghost" id="cvFRun">立即重渲</button><button class="btn primary" id="cvFSave">保存</button></div>');
    var d = s.body.querySelector('#cvFDepth');
    d.oninput = function () { s.body.querySelector('#cvFDepthV').textContent = d.value + ' 层'; };
    s.body.querySelector('#cvFSave').onclick = function () {
      saveCfg({
        on: s.body.querySelector('#cvFOn').checked,
        depth: Number(d.value),
        immersive: s.body.querySelector('#cvFImm').checked,
        template: s.body.querySelector('#cvFTpl').value
      });
      s.close();
      renderFloors(true);
      toast('已保存');
    };
    s.body.querySelector('#cvFRun').onclick = function () { renderFloors(true); toast('重新渲染'); };
  }

  /* 样式 */
  var st = document.createElement('style');
  st.textContent = `
  .cv-floored > .bubble,
  .cv-floored > .avatar{display:none}
  .cv-floor{margin:2px 0 8px;width:100%}
  .cv-floor iframe{width:100%;min-height:30px;border:none;background:transparent;display:block}
  .cv-lore-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:rgba(var(--cv-ai,.7));border:1px solid var(--line);margin-bottom:8px}
  .cv-lore-dot{width:9px;height:9px;border-radius:50%;flex:none}
  .cv-lore-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .cv-lore-main b{font-size:12.5px}
  .cv-lore-main span{font-size:11px;color:var(--dim2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cv-lore-val{font-size:11px;color:var(--dim2);width:38px;text-align:right}
  `;
  document.head.appendChild(st);

  // 开场白去重：宿主并发挂载时可能插两条一样的
  var dedupeAt = {};
  async function dedupeGreeting() {
    var id = chatId();
    if (!id) return;
    var now = Date.now();
    if (dedupeAt[id] && now - dedupeAt[id] < 4000) return;
    dedupeAt[id] = now;
    try {
      var msgs = await CV.chat.load(id);
      var as = msgs.filter(function (m) { return m.role === 'assistant'; });
      if (as.length >= 2 && String(as[0].content) === String(as[1].content)) {
        await CV.db.del('messages', as[1].id);
        CV.ui.route('chat/' + id);
      }
    } catch (e) {}
  }

  /* 兜底渲染：消息里出现 HTML 或代码围栏，且没被楼层接管时就地渲染 */
  function fallbackRender() {
    if (!isChat()) return;
    if (document.getElementById('msgs') && document.querySelector('#msgs .cv-floor')) return; // 已接管，别再动
    var box = document.getElementById('msgs');
    if (!box) return;
    var c = cfg();
    if (!c.on) return;
    var rd = (window.__cvRenderer && window.__cvRenderer()) || { on: true, depth: 3 };
    if (rd.on === false) return;
    if (rd.depth && rd.depth > 0 && c.depth !== rd.depth) c.depth = rd.depth;
    $$('.msg', box).forEach(function (node) {
      if (node.classList.contains('cv-floored')) return;
      if (node.dataset.cvFb === '1') return;
      var txtEl = node.querySelector('.txt');
      if (!txtEl) return;
      var raw = String(txtEl.textContent || '');
      if (!/```html|<!doctype|<div|<section|<table|<button/i.test(raw)) return;
      node.dataset.cvFb = '1';
      var cleaned = prepareText(raw, null, { role: 'assistant' }, {}, null)
        .replace(/```html\n?/gi, '').replace(/```/g, '').trim();
      // 套当前卡的模板（拿不到就用原样）
      var chat = null;
      try { chat = null; } catch (e) {}
      mountFrame(node, styleWrap('', '<div class="mes">' + cleaned + '</div>'), { ts: Date.now() });
      var bubble = node.querySelector('.bubble');
      if (bubble) bubble.style.display = 'none';
    });
  }

  /* 同步 */
  var t = null;
  function watchMsgs() {
    var box = document.getElementById('msgs');
    if (!box || box.__cvObs) return;
    box.__cvObs = true;
    new MutationObserver(function () {
      clearTimeout(box.__cvT);
      box.__cvT = setTimeout(function () { try { renderFloors(false); } catch (e) {} }, 260);
    }).observe(box, { childList: true });
    try { renderFloors(false); } catch (e) {}
  }
  function sync() {
    clearTimeout(t);
    t = setTimeout(function () {
      try { wire(); } catch (e) {}
      try { watchMsgs(); } catch (e) {}
      try { fallbackRender(); } catch (e) {}
      try { dedupeGreeting(); } catch (e) {}
    }, 150);
  }
  window.addEventListener('hashchange', sync);
  var ob = new MutationObserver(function () { sync(); });
  var app = document.getElementById('app');
  if (app) ob.observe(app, { childList: true, subtree: false });
  // 楼层的定时重试不依赖工具条是否存在
  setInterval(function () {
    if (!isChat()) return;
    try { renderFloors(false); } catch (e) {}
    try { maybeAutoFix(); } catch (e) {}
  }, 3000);
  window.addEventListener('hashchange', function () {
    if (!isChat()) return;
    setTimeout(function () { try { renderFloors(true); } catch (e) {} }, 700);
  });
  sync();

  // 主页面桩：卡脚本会写 parent.$("#send_textarea")
  (function hostStub() {
    if (window.__cvHostStub) return;
    window.__cvHostStub = 1;
    function mk(name, tag, css) {
      if (document.getElementById(name)) return;
      var el = document.createElement(tag);
      el.id = name;
      el.style.cssText = css;
      document.body.appendChild(el);
      return el;
    }
    var ta = mk('send_textarea', 'textarea', 'position:fixed;left:-9999px;top:0;width:10px;height:10px');
    var sb = mk('send_but', 'div', 'position:fixed;left:-9999px;width:1px;height:1px');
    if (ta) ta.addEventListener('input', function () {
      var i = document.getElementById('input');
      if (i) { i.value = ta.value; i.dispatchEvent(new Event('input')); }
    });
    if (sb) sb.addEventListener('click', function () {
      var b = document.getElementById('send');
      if (b) b.click();
    });
    window.$ = window.jQuery = function (sel) {
      var el = (sel === document.body || sel === document.documentElement) ? sel
        : (typeof sel === 'string' ? (sel === 'body' ? document.body : document.querySelector(sel)) : sel);
      var api = {
        length: el ? 1 : 0, 0: el,
        val: function (v) {
          if (v === undefined) return el ? el.value : '';
          if (el) { el.value = v; el.dispatchEvent(new Event('input')); }
          return api;
        },
        text: function (v) { if (v === undefined) return el ? el.textContent : ''; if (el) el.textContent = v; return api; },
        html: function (v) { if (v === undefined) return el ? el.innerHTML : ''; if (el) el.innerHTML = v; return api; },
        on: function (ev, fn) { if (el) el.addEventListener(ev, fn); return api; },
        click: function (fn) { if (fn) { if (el) el.addEventListener('click', fn); } else if (el) el.click(); return api; },
        trigger: function (ev) { if (el) el.dispatchEvent(new Event(ev)); return api; },
        attr: function (k, v) { if (!el) return ''; if (v === undefined) return el.getAttribute(k); el.setAttribute(k, v); return api; },
        css: function () { return api; },
        load: function () { return api; }
      };
      return api;
    };
    window.$.ajax = function () { return { done: function () { return this; }, fail: function () { return this; }, always: function () { return this; } }; };
    window.$.getJSON = window.$.ajax;
  })();

  // 卡内常见的刷新函数名，变量变了就调一次
  var REFRESH_FNS = ['populateCharacterData', 'populateData', 'renderStatus', 'updateStatus', 'refreshUI', 'renderUI', 'updateUI'];
  function callCardRefresh(win) {
    if (!win) return;
    REFRESH_FNS.forEach(function (n) {
      try { if (typeof win[n] === 'function') win[n](); } catch (e) {}
    });
  }

  // 变量热更新：不重建 iframe，直接刷新卡内数据
  function refreshVars(vars) {
    $$('#msgs .cv-floor iframe').forEach(function (f) {
      try {
        f.contentWindow.__CV_VARS = vars || {};
        f.contentWindow.postMessage({ __cvvars: vars || {} }, '*');
        if (f.contentWindow.Mvu) f.contentWindow.Mvu._vars = vars || {};
        if (f.contentWindow.emitEvent) f.contentWindow.emitEvent('VARIABLE_UPDATE_ENDED');
        callCardRefresh(f.contentWindow);
      } catch (e) {}
    });
  }

  // 变量更新格式要求（默认开）
  function varsReqCfg() {
    try { var v = localStorage.getItem('cv.varsReq.v1'); return v === null ? true : v === 'true'; } catch (e) { return true; }
  }
  function setVarsReq(on) { try { localStorage.setItem('cv.varsReq.v1', on ? 'true' : 'false'); } catch (e) {} }

  // 这张卡到底有没有变量系统
  function cardHasVars(chat) {
    if (!chat) return false;
    var vars = chat.vars || {};
    if (vars.stat_data && Object.keys(vars.stat_data).length) return true;
    var role = chat.cast && chat.cast[0];
    if (!role) return false;
    var blob = ((role.regex || []).map(function (r) { return (r.findRegex || '') + ' ' + (r.replaceString || ''); }).join(' ')) +
      ' ' + ((role.theme && role.theme.html) || '');
    if (/UpdateVariable|updatevariable|stat_data|变量更新/i.test(blob)) return true;
    // 世界书里提过变量更新也算
    if ((role.lorebook || []).some(function (e) { return /UpdateVariable|stat_data|变量更新/i.test(String(e.content || '')); })) return true;
    return false;
  }

  function buildVarsRequirement(chat) {
    if (!cardHasVars(chat)) return '';   // 这张卡没有变量系统，别硬塞
    var keys = [];
    var vars = (chat && chat.vars) || {};
    var sd = vars.stat_data || {};
    Object.keys(sd).forEach(function (g) {
      var v = sd[g];
      if (v && typeof v === 'object') {
        Object.keys(v).forEach(function (k) {
          var val = v[k];
          if (Array.isArray(val) || (val && typeof val === 'object')) return;
          keys.push(g + '.' + k);
        });
      }
    });
    var role = chat && chat.cast && chat.cast[0];
    var blob = ((role && role.regex) || []).map(function (r) {
      return String(r.replaceString || '') + ' ' + String(r.findRegex || '');
    }).join(' ');
    // 只补卡里真正出现过的字段名
    var candidates = ['世界.日期','世界.时段','世界.天气','世界.当前地点','世界.地点','教堂.资金','教堂.声望','教堂.目标金额',
      '艾莉丝.精力','艾莉丝.清洁度','艾莉丝.当前状态','艾莉丝.总服务','当前客人.姓名','当前客人.满意度'];
    candidates.forEach(function (k) {
      var name = k.split('.')[1];
      if (blob.indexOf(name) >= 0 && keys.indexOf(k) < 0) keys.push(k);
    });
    if (!keys.length) {
      // 有变量系统但认不出字段：只给格式，不列具体字段，避免误导
      return '【变量更新格式要求】\n每次回复的最后，必须输出一段 <UpdateVariable>，里面是 JSON Patch 数组（[{"op":"replace","path":"/分组/字段","value":新值}]），把卡里要求的所有字段都写一遍。';
    }
    var lines = keys.slice(0, 24).map(function (k) {
      return '  {"op":"replace","path":"/' + k.split('.').join('/') + '","value":"<新值>"}';
    }).join(',\n');
    return '【变量更新格式要求（必须遵守）】\n' +
      '每次回复的最后，必须输出一段 <UpdateVariable>，里面是 JSON Patch 数组，至少覆盖下面这些字段：\n' +
      '\n<UpdateVariable>\n[\n' + lines + '\n]\n</UpdateVariable>\n\n' +
      '数值就用数字，不要加引号；文字用字符串。不要省略任何一个字段，没变化的也要原样写一遍。';
  }

  window.__cvVarsReq = { on: varsReqCfg, set: setVarsReq, build: buildVarsRequirement, has: cardHasVars };
  window.__cvVarsRequirementText = buildVarsRequirement;


  // 模型漏了变量时，单独再问一次（只取数据，不写剧情）
  async function askVarsOnly(chat, uid) {
    try {
      var msgs = await CV.chat.load(chat.id);
      var recent = msgs.slice(-6).map(function (m) { return { role: m.role, content: String(m.content || '').slice(0, 4000) }; });
      var role = chat.cast && chat.cast[0];
      var fields = [];
      var sd = (chat.vars || {}).stat_data || {};
      Object.keys(sd).forEach(function (g) {
        var v = sd[g];
        if (v && typeof v === 'object') Object.keys(v).forEach(function (k) {
          var val = v[k];
          if (!Array.isArray(val) && (!val || typeof val !== 'object')) fields.push(g + '/' + k);
        });
      });
      var hint = fields.length ? ('必须覆盖这些字段：' + fields.slice(0, 20).join('、')) : '';
      var req = [
        { role: 'system', content: '你是数据提取器，只输出变量更新的 JSON Patch 数组，格式：<UpdateVariable>[{"op":"replace","path":"/分组/字段","value":新值}]</UpdateVariable>。不要输出任何解释或剧情。' },
        ...recent,
        { role: 'user', content: '根据以上对话，输出此刻的状态变量更新。' + hint + ' 只输出 <UpdateVariable> 标签和其中的 JSON 数组。' }
      ];
      var res = await CV.api.chat(req, { maxTokens: 900, temperature: 0.2 });
      var text = String((res && res.text) || '');
      var m = text.match(/<UpdateVariable[^>]*>([\s\S]*?)<\/UpdateVariable>/i);
      var body = m ? m[1] : text;
      var arr = null;
      try { arr = JSON.parse(body); } catch (e) {
        var a = body.indexOf('['), b = body.lastIndexOf(']');
        if (a >= 0 && b > a) { try { arr = JSON.parse(body.slice(a, b + 1)); } catch (e2) {} }
      }
      if (!arr) { toast('模型没有返回可用的变量数据'); return false; }
      if (!chat.vars) chat.vars = {};
      if (!chat.vars.stat_data) chat.vars.stat_data = {};
      var changed = false;
      (Array.isArray(arr) ? arr : []).forEach(function (op) {
        if (!op || !op.path) return;
        var path = String(op.path).replace(/^\//, '').replace(/^stat_data\//, '');
        var ks = path.split('/');
        var cur = chat.vars.stat_data;
        for (var i = 0; i < ks.length - 1; i++) {
          if (typeof cur[ks[i]] !== 'object' || cur[ks[i]] === null) cur[ks[i]] = {};
          cur = cur[ks[i]];
        }
        cur[ks[ks.length - 1]] = op.value;
        changed = true;
      });
      if (!changed) { toast('变量没有变化'); return false; }
      await CV.db.put('chats', chat);
      refreshVars(chat.vars);
      toast('变量已补上');
      return true;
    } catch (e) {
      toast('补变量失败：' + (e && e.message ? e.message : '未知错误'));
      return false;
    }
  }


  // 自动补变量：AI 回复没写 UpdateVariable 时，后台再问一次
  var autoFixState = { busy: false, done: {} };
  function autoFixCfg() {
    try { var v = localStorage.getItem('cv.varsAuto.v1'); return v === null ? true : v === 'true'; } catch (e) { return true; }
  }
  function setAutoFix(on) { try { localStorage.setItem('cv.varsAuto.v1', on ? 'true' : 'false'); } catch (e) {} }

  async function maybeAutoFix() {
    if (!autoFixCfg() || autoFixState.busy) return;
    if (!isChat()) return;
    var id = chatId();
    if (!id) return;
    var box = document.getElementById('msgs');
    if (!box) return;
    var nodes = Array.from(box.querySelectorAll('.msg.assistant:not(.streaming), .group-block:not(.streaming)'));
    if (!nodes.length) return;
    var last = nodes[nodes.length - 1];
    var txtEl = last.querySelector('.txt');
    var txt = txtEl ? String(txtEl.textContent || '') : '';
    if (/<UpdateVariable/i.test(txt)) return;        // 已经有，跳过
    if (autoFixState.done[id + ':' + txt.slice(0, 24)]) return;  // 这轮补过了
    if (txt.trim().length < 4) return;
    autoFixState.busy = true;
    try {
      var chat = await CV.db.get('chats', id);
      if (!chat) return;
      var ok2 = await askVarsOnly(chat, id);
      autoFixState.done[id + ':' + txt.slice(0, 24)] = ok2 ? 2 : 1;
    } catch (e) {
    } finally {
      autoFixState.busy = false;
    }
  }

  window.__cvTavern = {
    extractCss: extractCssLines,
    askVarsOnly: askVarsOnly,
    maybeAutoFix: maybeAutoFix,
    autoFix: { on: autoFixCfg, set: setAutoFix },
    refreshVars: refreshVars,
    expand: expand,
    parseVarBlocks: parseVarBlocks,
    applyCardRegex: applyCardRegex,
    renderFloors: renderFloors,
    openFloorPanel: openFloorPanel,
    openLoreProb: openLoreProb,
    openCastEditor: openCastEditor,
    cfg: cfg,
    saveCfg: saveCfg
  };
})();

</script>
<script id="cv-plugins-script">
/* ============================================================================
 * 角色宇宙 · 增强包 v9 · 插件运行时
 * 目标：能装"酒馆插件"那类脚本，并给它们一套可用的 API。
 * 机制：每个插件在 sandbox iframe 里跑，主页面通过 postMessage 通信。
 * API（插件里用 window.T）：
 *   T.onMessage(fn)      注册消息钩子：fn({text, role, vars}) → 返回 HTML 字符串或 {html}
 *   T.getVar(k) / T.setVar(k,v)
 *   T.toast(msg)
 *   T.addCSS(css)
 *   T.log(...)
 * 主页面把返回的 HTML 挂到对应楼层。
 * ========================================================================== */
(function () {
  'use strict';
  var CV = window.__CV;
  if (!CV || window.__cvPluginsLoaded) return;
  window.__cvPluginsLoaded = true;

  function g(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function s2(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(m, ms) { try { CV.ui.toast(m, ms || 2400); } catch (e) {} }
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function uid(p) { return CV.ui.uid(p || 'pl_'); }

  var busy = false;

  function sheet(title, body) {
    var wrap = document.createElement('div');
    wrap.className = 'overlay';
    wrap.innerHTML = '<div class="sheet"><div class="cv-sheet-head"><h3>' + esc(title) + '</h3>' +
      '<button class="icon-btn" data-x9 style="width:32px;height:32px;font-size:20px">×</button></div><div data-b9></div></div>';
    (document.getElementById('modal-root') || document.body).appendChild(wrap);
    var api = { el: wrap, body: wrap.querySelector('[data-b9]'), close: function () { wrap.remove(); } };
    wrap.addEventListener('click', function (e) { if (e.target === wrap) api.close(); });
    wrap.querySelector('[data-x9]').onclick = api.close;
    return api;
  }

  /* ---------------- 存储 ---------------- */
  async function listPlugins() {
    var libs = await CV.db.all('libs');
    return libs.filter(function (l) { return l.type === 'plugin'; });
  }
  async function savePlugin(p) { return CV.db.put('libs', p); }
  async function delPlugin(id) { return CV.db.del('libs', id); }

  /* ---------------- 运行时 ---------------- */
  // 每个插件一个 iframe，脚本运行在其中
  var runners = {};

  function runnerDoc(code) {
    return '<!doctype html><meta charset="utf-8"><body style="margin:0">' +
      '<script>\n' +
      'var T = (function(){\n' +
      '  var handlers = [];\n' +
      '  function send(m){ parent.postMessage(Object.assign({__cvpl:1}, m), "*"); }\n' +
      '  return {\n' +
      '    onMessage: function(fn){ handlers.push(fn); },\n' +
      '    __run: function(payload){ var out=null; for (var i=0;i<handlers.length;i++){ try{ var r=handlers[i](payload); if(r!=null) out=r; }catch(e){ send({type:"log",msg:String(e)}); } } return out; },\n' +
      '    getVar: function(k){ return (payloadVars||{})[k]; },\n' +
      '    setVar: function(k,v){ send({type:"setvar",key:k,value:v}); },\n' +
      '    toast: function(m){ send({type:"toast",msg:String(m)}); },\n' +
      '    addCSS: function(css){ send({type:"css",css:String(css)}); },\n' +
      '    log: function(){ send({type:"log",msg:Array.prototype.slice.call(arguments).map(String).join(" ")}); }\n' +
      '  };\n' +
      '})();\n' +
      'var payloadVars = {};\n' +
      'window.addEventListener("message", function(e){\n' +
      '  var d = e.data || {};\n' +
      '  if (d.__cvplcmd !== "run") return;\n' +
      '  payloadVars = d.vars || {};\n' +
      '  var out = null;\n' +
      '  try { out = T.__run({ text: d.text, role: d.role, vars: d.vars }); } catch (err) { parent.postMessage({__cvpl:1, type:"log", msg:String(err)}, "*"); }\n' +
      '  if (out != null) parent.postMessage({__cvpl:1, type:"html", html: String(out)}, "*");\n' +
      '});\n' +
      '<\/script>\n' +
      '<script>\n' + String(code || '') + '\n<\/script>\n' +
      '</body>';
  }

  function getRunner(p) {
    if (runners[p.id]) return runners[p.id];
    var f = document.createElement('iframe');
    f.setAttribute('sandbox', 'allow-scripts');
    f.style.cssText = 'position:absolute;width:0;height:0;border:0;opacity:0;pointer-events:none';
    document.body.appendChild(f);
    f.srcdoc = runnerDoc(p.body || '');
    runners[p.id] = f;
    return f;
  }

  // 收集插件返回的 HTML（异步，超时 800ms 视为无输出）
  function runPlugin(p, payload) {
    return new Promise(function (resolve) {
      var f = getRunner(p);
      var done = false;
      var tid = setTimeout(function () { if (!done) { done = true; cleanup(); resolve(null); } }, 800);
      function onMsg(e) {
        var d = e.data || {};
        if (!d.__cvpl) return;
        if (d.type === 'html' && !done) { done = true; cleanup(); resolve(d.html); }
        else if (d.type === 'toast') toast(d.msg);
        else if (d.type === 'css') injectCSS(d.css);
        else if (d.type === 'log') console.log('[plugin ' + (p.name || '') + ']', d.msg);
        else if (d.type === 'setvar') {
          CV.db.get('chats', location.hash.split('/')[2] || '').then(function (c) {
            if (!c) return;
            c.vars = c.vars || {};
            c.vars[d.key] = d.value;
            CV.db.put('chats', c);
          }).catch(function () {});
        }
      }
      function cleanup() { window.removeEventListener('message', onMsg); clearTimeout(tid); }
      window.addEventListener('message', onMsg);
      try {
        f.contentWindow.postMessage({ __cvplcmd: 'run', text: payload.text, role: payload.role, vars: payload.vars || {} }, '*');
      } catch (e) { cleanup(); resolve(null); }
    });
  }

  var cssInjected = {};
  function injectCSS(css) {
    if (cssInjected[css]) return;
    cssInjected[css] = 1;
    var st = document.createElement('style');
    st.textContent = css;
    document.head.appendChild(st);
  }

  /* ---------------- 应用到楼层 ---------------- */
  async function applyPlugins() {
    if (!/^#\/chat\//.test(location.hash || '')) return;
    if (busy) return;
    busy = true;
    try {
      var plugins = (await listPlugins()).filter(function (p) { return p.enabled !== false; });
      if (!plugins.length) return;
      var id = location.hash.replace(/^#\/chat\//, '');
      var chat = await CV.db.get('chats', id);
      if (!chat) return;
      var msgs = await CV.chat.load(id);
      var nodes = $$('#msgs .msg');
      var recent = msgs.filter(function (m) { return m.role !== 'system'; }).slice(-6);
      var start = Math.max(0, nodes.length - recent.length);
      for (var i = 0; i < recent.length; i++) {
        var m = recent[i], node = nodes[start + i];
        if (!node) continue;
        if (node.dataset.cvPlugin === String(m.ts)) continue;
        for (var j = 0; j < plugins.length; j++) {
          var html = await runPlugin(plugins[j], { text: m.content, role: m.role, vars: chat.vars || {} });
          if (html) {
            var box = node.querySelector('.cv-floor');
            if (!box) {
              box = document.createElement('div');
              box.className = 'cv-floor';
              var f2 = document.createElement('iframe');
              f2.setAttribute('sandbox', 'allow-scripts');
              f2.style.cssText = 'width:100%;border:none;background:transparent';
              box.appendChild(f2);
              node.appendChild(box);
            }
            var frame = box.querySelector('iframe');
            if (frame) {
              frame.srcdoc = '<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:transparent;color:#e8ebf4;font:15px/1.7 system-ui}</style>' + html;
            }
            node.dataset.cvPlugin = String(m.ts);
            break;
          }
        }
      }
    } catch (e) { console.warn('[plugins]', e); }
    finally { busy = false; }
  }

  /* ---------------- 面板 ---------------- */
  async function openPluginPanel() {
    var list = await listPlugins();
    var s = sheet('插件', '');
    function paint() {
      var html = '<div class="cv-note">装的是脚本型插件：在自己的沙箱里跑，通过 T API 处理消息。<br>' +
        '常用 API：<code>T.onMessage(fn)</code>、<code>T.getVar</code>、<code>T.setVar</code>、<code>T.addCSS</code>。</div>';
      html += '<div class="cv-preset-list">' + (list.length ? list.map(function (p) {
        return '<div class="cv-preset' + (p.enabled !== false ? ' on' : '') + '">' +
          '<div class="cv-preset-head"><b>' + esc(p.name) + '</b>' +
          '<button class="icon-btn" data-del="' + esc(p.id) + '" style="width:26px;height:26px;font-size:14px">✕</button></div>' +
          '<div class="cv-pre" style="max-height:80px">' + esc(String(p.body || '').slice(0, 300)) + '</div>' +
          '<label class="cv-check"><input type="checkbox" data-en="' + esc(p.id) + '"' + (p.enabled !== false ? ' checked' : '') + '> 启用</label>' +
          '</div>';
      }).join('') : '<div class="cv-empty">还没有插件</div>') + '</div>';
      html += '<div class="sheet foot"><button class="btn primary" id="cvPlAdd">＋ 导入插件</button></div>';
      s.body.innerHTML = html;
      $$('[data-en]', s.body).forEach(function (cb) {
        cb.onchange = async function () {
          var p = list.filter(function (x) { return x.id === cb.getAttribute('data-en'); })[0];
          if (!p) return;
          p.enabled = cb.checked;
          await savePlugin(p);
          paint();
        };
      });
      $$('[data-del]', s.body).forEach(function (b) {
        b.onclick = async function () {
          await delPlugin(b.getAttribute('data-del'));
          list = await listPlugins(); paint();
        };
      });
      s.body.querySelector('#cvPlAdd').onclick = function () { s.close(); importPlugin(); };
    }
    paint();
  }

  function importPlugin() {
    var s = sheet('导入插件', '' +
      '<div class="cv-note">把 .js 文件拖进来，或粘贴脚本。脚本在沙箱里运行，能拿到消息文本，返回 HTML 就会被渲染成卡片。</div>' +
      '<textarea class="textarea" id="cvPlPaste" rows="8" placeholder="// 示例：\nT.onMessage(function(m){\n  if (!/状态/.test(m.text)) return null;\n  return \'<div style=&quot;padding:10px&quot;>\' + m.text + \'</div>\';\n});"></textarea>' +
      '<div class="sheet foot"><button class="btn" id="cvPlFile">选文件</button><button class="btn primary" id="cvPlSave">保存</button></div>');
    async function save(code, name) {
      if (!code || !code.trim()) { toast('脚本是空的'); return; }
      var p = { id: uid(), type: 'plugin', name: name || ('插件 ' + new Date().toLocaleTimeString('zh-CN')), body: code, enabled: true };
      await savePlugin(p);
      s.close();
      toast('已导入');
      openPluginPanel();
      applyPlugins();
    }
    s.body.querySelector('#cvPlFile').onclick = function () {
      var inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.js,text/javascript,application/javascript';
      inp.onchange = function () {
        var f = inp.files && inp.files[0];
        if (!f) return;
        f.text().then(function (t) { save(t, f.name); });
      };
      inp.click();
    };
    s.body.querySelector('#cvPlSave').onclick = function () { save(s.body.querySelector('#cvPlPaste').value, ''); };
  }

  /* ---------------- 入口 ---------------- */
  function wire() {
    var bar = document.getElementById('cvChatBar');
    if (bar && !document.getElementById('cvPlChip')) {
      var b = document.createElement('button');
      b.className = 'chip cv-chip';
      b.id = 'cvPlChip';
      b.innerHTML = '🧩 插件';
      b.onclick = openPluginPanel;
      bar.appendChild(b);
    }
    applyPlugins();
  }

  var t = null;
  function sync() { clearTimeout(t); t = setTimeout(function () { try { wire(); } catch (e) {} }, 200); }
  window.addEventListener('hashchange', sync);
  var app = document.getElementById('app');
  if (app) new MutationObserver(sync).observe(app, { childList: true, subtree: false });
  setInterval(function () { if (/^#\/chat\//.test(location.hash || '')) wire(); }, 2000);
  sync();

  window.__cvPlugins = { list: listPlugins, open: openPluginPanel, run: runPlugin, apply: applyPlugins };
})();

</script>
<script id="cv-ui10-script">
/* ============================================================================
 * 角色宇宙 · 增强包 v10 · 酒馆式预设面板 + 设置分页 + 开场白切换 + 卡片按钮桥
 * ========================================================================== */
(function () {
  'use strict';
  var CV = window.__CV;
  if (!CV || window.__cvUI10Loaded) return;
  window.__cvUI10Loaded = true;

  function g(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function s2(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(m, ms) { try { CV.ui.toast(m, ms || 2400); } catch (e) {} }
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function chatId() { var m = location.hash.match(/^#\/chat\/(.+)$/); return m ? decodeURIComponent(m[1]) : null; }
  function isSettings() { return /^#\/settings/.test(location.hash || ''); }

  function sheet(title, body) {
    var wrap = document.createElement('div');
    wrap.className = 'overlay';
    wrap.innerHTML = '<div class="sheet"><div class="cv-sheet-head"><h3>' + esc(title) + '</h3>' +
      '<button class="icon-btn" data-xa style="width:32px;height:32px;font-size:20px">×</button></div><div data-ba>' + (body || '') + '</div></div>';
    (document.getElementById('modal-root') || document.body).appendChild(wrap);
    var api = { el: wrap, body: wrap.querySelector('[data-ba]'), close: function () { wrap.remove(); } };
    wrap.addEventListener('click', function (e) { if (e.target === wrap) api.close(); });
    wrap.querySelector('[data-xa]').onclick = api.close;
    return api;
  }

  /* ==================================================================
   * 一、预设参数（ST 风格）
   * ================================================================== */
  var PARAM_DEFS = [
    { k: 'openai_max_tokens', label: '回复长度 (Token)', min: 50, max: 4000, step: 10, def: 350 },
    { k: 'openai_max_context', label: '上下文长度 (Token)', min: 512, max: 32768, step: 256, def: 8192 },
    { k: 'temperature', label: '温度', min: 0, max: 2, step: 0.01, def: 1 },
    { k: 'top_k', label: 'Top K', min: 0, max: 200, step: 1, def: 64 },
    { k: 'top_p', label: 'Top P', min: 0, max: 1, step: 0.01, def: 0.98 },
    { k: 'typical_p', label: 'Typical P', min: 0, max: 1, step: 0.01, def: 1 },
    { k: 'min_p', label: 'Min P', min: 0, max: 1, step: 0.01, def: 0 },
    { k: 'top_a', label: 'Top A', min: 0, max: 1, step: 0.01, def: 0 },
    { k: 'tfs', label: '无尾采样', min: 0, max: 1, step: 0.01, def: 1 },
    { k: 'repetition_penalty', label: '重复惩罚', min: 0, max: 2, step: 0.01, def: 1 },
    { k: 'repetition_penalty_range', label: '重复惩罚范围', min: 0, max: 8192, step: 1, def: 5442 },
    { k: 'mirostat', label: 'Mirostat 模式', min: 0, max: 2, step: 1, def: 0 },
    { k: 'mirostat_tau', label: 'τ (Tau)', min: 0, max: 10, step: 0.5, def: 5 },
    { k: 'mirostat_eta', label: 'η (Eta)', min: 0, max: 1, step: 0.05, def: 0.1 }
  ];

  function presetById(id) {
    try {
      var all = (window.__cvPlus4 && window.__cvPlus4.presets()) || [];
      for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
    } catch (e) {}
    return null;
  }

  function openPresetEditor(id) {
    var p = presetById(id) || { id: 'bp_xiaomao', name: '小猫之神', params: {}, system: '' };
    var params = Object.assign({}, p.params || {});
    var s = sheet('预设 · ' + (p.name || ''), '');
    function paint() {
      var html = '';
      html += '<div class="cv-note">这里的参数照酒馆的排布做：拖动滑块，或者点数字直接输入。保存后写进预设，启用预设时自动套到对话上。</div>';
      html += '<div class="cv-param-grid">';
      PARAM_DEFS.forEach(function (d) {
        var v = params[d.k] != null ? params[d.k] : d.def;
        html += '<div class="cv-param">' +
          '<div class="cv-param-head"><span>' + d.label + '</span></div>' +
          '<input type="range" data-k="' + d.k + '" min="' + d.min + '" max="' + d.max + '" step="' + d.step + '" value="' + v + '">' +
          '<input class="cv-param-num" data-nk="' + d.k + '" type="number" step="' + d.step + '" value="' + v + '">' +
          '</div>';
      });
      html += '</div>';
      html += '<div class="cv-label">预设正文（' + (p.system || '').length + ' 字）</div>' +
        '<div class="cv-pre" style="max-height:30vh">' + esc(String(p.system || '').slice(0, 1200)) + (String(p.system || '').length > 1200 ? '\n…' : '') + '</div>';
      html += '<div class="sheet foot"><button class="btn ghost" id="cvPaApply">套到当前对话</button>' +
        '<button class="btn primary" id="cvPaSave">保存</button></div>';
      s.body.innerHTML = html;

      $$('[data-k]', s.body).forEach(function (r) {
        r.oninput = function () {
          params[r.getAttribute('data-k')] = Number(r.value);
          var n = s.body.querySelector('[data-nk="' + r.getAttribute('data-k') + '"]');
          if (n) n.value = r.value;
        };
      });
      $$('[data-nk]', s.body).forEach(function (n) {
        n.oninput = function () {
          var k = n.getAttribute('data-nk');
          params[k] = Number(n.value);
          var r = s.body.querySelector('[data-k="' + k + '"]');
          if (r) r.value = n.value;
        };
      });
      s.body.querySelector('#cvPaSave').onclick = function () {
        var list = g('cv.preset.override', {});
        list[p.id] = params;
        s2('cv.preset.override', list);
        toast('参数已保存到预设');
        s.close();
      };
      s.body.querySelector('#cvPaApply').onclick = async function () {
        var id2 = chatId();
        if (!id2) { toast('先进一个对话'); return; }
        var chat = await CV.db.get('chats', id2);
        chat.ov = chat.ov || {};
        if (params.temperature != null) chat.ov.temperature = params.temperature;
        var mt = params.openai_max_tokens || params.max_tokens;
        if (mt) chat.ov.maxTokens = Math.min(8192, Number(mt));
        await CV.db.put('chats', chat);
        toast('已套到当前对话：温度 ' + chat.ov.temperature + ' / ' + chat.ov.maxTokens + 't');
        s.close();
      };
    }
    paint();
  }

  /* ==================================================================
   * 二、设置分页
   * ================================================================== */
  var SET_TABS = [
    { k: 'api', n: '接口', icon: '🔌' },
    { k: 'preset', n: '预设', icon: '🎛' },
    { k: 'render', n: '代码渲染', icon: '🧩' },
    { k: 'look', n: '外观', icon: '🎨' },
    { k: 'data', n: '数据', icon: '💾' }
  ];

  function ensureSettingsTabs() {
    if (!isSettings()) return;
    var pad = $('.pad');
    if (!pad) return;
    if (document.getElementById('cvSetTabs')) return;

    var nav = document.createElement('div');
    nav.id = 'cvSetTabs';
    nav.className = 'cv-settabs';
    nav.innerHTML = SET_TABS.map(function (t, i) {
      return '<button class="cv-settab' + (i === 0 ? ' on' : '') + '" data-st="' + t.k + '">' +
        '<i>' + t.icon + '</i><span>' + t.n + '</span></button>';
    }).join('');
    pad.insertBefore(nav, pad.firstChild);

    var cur = 'api';
    function secOf(txt) {
      if (/模型接口|对话参数|全局系统|玩家设定|大世界开场/.test(txt)) return 'api';
      if (/立绘/.test(txt)) return 'look';
      if (/外观/.test(txt)) return 'look';
      if (/存档/.test(txt)) return 'data';
      return 'api';
    }
    // 以 section-title 为界，把设置页切成块，每块整体归到一个 tab
    var blockWrap = [];
    (function slice() {
      var nodes = Array.prototype.slice.call(pad.children);
      var curSec = 'api', bucket = [];
      function flush() {
        if (!bucket.length) return;
        var d = document.createElement('div');
        d.className = 'cv-set-sec';
        d.dataset.cvSec = curSec;
        pad.insertBefore(d, bucket[0]);
        bucket.forEach(function (n) { d.appendChild(n); });
        blockWrap.push(d);
        bucket = [];
      }
      nodes.forEach(function (n) {
        if (n.id === 'cvSetTabs' || n.dataset.cvOwn) return;
        if (n.classList && n.classList.contains('section-title')) {
          flush();
          curSec = secOf(n.textContent || '');
        }
        bucket.push(n);
      });
      flush();
    })();
    function applyTab() {
      blockWrap.forEach(function (b) { b.style.display = (b.dataset.cvSec === cur) ? '' : 'none'; });
      $$('[data-cv-own]', pad).forEach(function (el) {
        el.style.display = (el.dataset.cvOwn === cur) ? '' : 'none';
      });
      $$('[data-cv-own]', pad).forEach(function (el) {
        el.style.display = (el.dataset.cvOwn === cur) ? '' : 'none';
      });
    }

    // 预设区
    var presetBox = document.createElement('div');
    presetBox.dataset.cvOwn = 'preset';
    presetBox.innerHTML = '<div class="cv-note">内置预设可以直接用；也能导入酒馆预设（含 prompts 数组与采样参数）。</div>' +
      '<div id="cvPresetList" class="cv-preset-list"></div>' +
      '<div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap">' +
      '<button class="btn sm" id="cvOpenPresetLib">打开预设库</button>' +
      '<button class="btn sm" id="cvEditXm">编辑「小猫之神」参数</button></div>';
    pad.appendChild(presetBox);

    // 渲染区
    var renderBox = document.createElement('div');
    renderBox.dataset.cvOwn = 'render';
    renderBox.innerHTML = '<div class="cv-note">楼层渲染（小白X）：消息里的 HTML / 占位符 / 变量 / 图片按角色卡模板渲染。</div>' +
      '<div class="row" style="gap:8px;flex-wrap:wrap">' +
      '<button class="btn sm" id="cvOpenFloor">打开楼层设置</button>' +
      '<button class="btn sm" id="cvOpenRegex">正则与美化</button>' +
      '<button class="btn sm" id="cvOpenPlugin">🧩 插件</button>' +
      '<button class="btn sm" id="cvOpenAssistant">🎗 酒馆助手</button>' +
      '<button class="btn sm" id="cvOpenMacro">🧬 提示词模板</button></div>';
    pad.appendChild(renderBox);

    // 外观区加"小白X"入口卡片（若已有 cvV4Card 则复用）
    nav.querySelectorAll('[data-st]').forEach(function (b) {
      b.onclick = function () {
        cur = b.getAttribute('data-st');
        nav.querySelectorAll('.cv-settab').forEach(function (x) { x.classList.toggle('on', x === b); });
        applyTab();
      };
    });
    applyTab();

    var opl = $('#cvOpenPresetLib');
    if (opl) opl.onclick = function () { if (window.__cvPlus4) window.__cvPlus4.openPresetSheet(); };
    var ex = $('#cvEditXm');
    if (ex) ex.onclick = function () { openPresetEditor('bp_xiaomao'); };
    var of = $('#cvOpenFloor');
    if (of) of.onclick = function () { if (window.__cvTavern) window.__cvTavern.openFloorPanel(); };
    var orx = $('#cvOpenRegex');
    if (orx) orx.onclick = function () { if (window.__cvPlus7) window.__cvPlus7.openBeautyPanel(); };
    var op = $('#cvOpenPlugin');
    if (op) op.onclick = function () { if (window.__cvPlugins) window.__cvPlugins.open(); };
    var oa = $('#cvOpenAssistant');
    if (oa) oa.onclick = function () { openAssistant(); };
    var om = $('#cvOpenMacro');
    if (om) om.onclick = function () { openMacro(); };

    // 预设区的列表
    if (window.__cvPlus4) {
      var list = window.__cvPlus4.presets().slice(0, 8);
      var box = $('#cvPresetList');
      if (box) box.innerHTML = list.map(function (x) {
        return '<div class="cv-preset"><div class="cv-preset-head"><b>' + esc(x.name) + '</b>' +
          (x.builtin ? '<span class="cv-tag">内置</span>' : '') + '</div>' +
          '<div class="cv-preset-desc">' + esc(x.desc || '') + '</div></div>';
      }).join('');
    }
  }

  // 酒馆助手（JS-Slash-Runner 的等价实现说明 + 插件入口）
  function openAssistant() {
    var s = sheet('酒馆助手 · 等价实现', '');
    s.body.innerHTML =
      '<div class="cv-note">酒馆助手的原版是本页面跑不起来的 SillyTavern 扩展（依赖它的 context 与事件总线）。这里用同等的机制替代：</div>' +
      '<div class="cv-kv"><span>楼层渲染</span><b>小白X 面板</b></div>' +
      '<div class="cv-kv"><span>变量 / 宏</span><b>内建（{{getvar::}} 等）</b></div>' +
      '<div class="cv-kv"><span>消息里的 JS</span><b>沙箱 iframe + T API</b></div>' +
      '<div class="cv-kv"><span>卡片按钮</span><b>data-send / data-input / data-var</b></div>' +
      '<div class="cv-note" style="margin-top:12px">需要装的脚本放到「插件」里：<code>T.onMessage(fn)</code> 返回 HTML 就会被渲染。<br>' +
      '卡片里的按钮只要带这些属性，点一下就会：<br>' +
      '<code>data-send="台词"</code> 直接发送；<code>data-input="台词"</code> 填进输入框；<code>data-var="hp" data-value="3"</code> 改变量。</div>' +
      '<div class="sheet foot"><button class="btn" id="cvAsPl">打开插件</button><button class="btn" id="cvAsFloor">楼层设置</button></div>';
    s.body.querySelector('#cvAsPl').onclick = function () { s.close(); if (window.__cvPlugins) window.__cvPlugins.open(); };
    s.body.querySelector('#cvAsFloor').onclick = function () { s.close(); if (window.__cvTavern) window.__cvTavern.openFloorPanel(); };
  }

  // 提示词模板（ST-Prompt-Template 的宏系统）
  function openMacro() {
    var s = sheet('提示词模板', '');
    var list = [
      ['{{user}}', '玩家名'], ['{{char}}', '角色名'], ['{{persona}}', '玩家设定'],
      ['{{getvar::hp}}', '读变量'], ['{{setvar::hp::10}}', '写变量'], ['{{addvar::hp::-1}}', '加减变量'],
      ['{{random::a,b,c}}', '随机取一个'], ['{{roll:1d6}}', '掷骰'], ['{{//注释}}', '删掉不显示'],
      ['{{time}}', '当前时间'], ['{{date}}', '当前日期']
    ];
    s.body.innerHTML = '<div class="cv-note">这些宏可以写在预设、角色卡、正则替换里。消息渲染时会先展开宏，再处理变量。</div>' +
      list.map(function (x) {
        return '<div class="cv-kv"><span><code>' + esc(x[0]) + '</code></span><b>' + esc(x[1]) + '</b></div>';
      }).join('') +
      '<div class="cv-note" style="margin-top:12px">改角色卡的 <code>theme.html</code> 也能直接用这些宏。</div>' +
      '<div class="sheet foot"><button class="btn primary" id="cvMcOk">知道了</button></div>';
    s.body.querySelector('#cvMcOk').onclick = s.close;
  }

  /* ==================================================================
   * 三、开场白切换（底部 < n/m >）
   * ================================================================== */
  async function ensureGreetPager() {
    var id = chatId();
    if (!id) return;
    var box = document.getElementById('cvGreetPager');
    var chat = await CV.db.get('chats', id);
    if (!chat) return;
    var role = chat.cast && chat.cast[0];
    var list = (role && role.greetings && role.greetings.length) ? role.greetings.slice()
      : ((role && role.greeting) ? [role.greeting] : []);
    if (list.length < 2) { if (box) box.remove(); return; }
    var msgs = await CV.chat.load(id);
    var first = null;
    for (var i = 0; i < msgs.length; i++) if (msgs[i].role === 'assistant') { first = msgs[i]; break; }
    var idx = first ? Math.max(0, list.indexOf(first.content)) : 0;

    if (!box) {
      box = document.createElement('div');
      box.id = 'cvGreetPager';
      box.className = 'cv-gpager';
      box.innerHTML = '<button data-gp="-1">‹</button><span data-gi>1/1</span><button data-gp="1">›</button>';
      document.body.appendChild(box);
      box.querySelectorAll('[data-gp]').forEach(function (b) {
        b.onclick = function () { switchGreet(Number(b.getAttribute('data-gp'))); };
      });
    }
    box.querySelector('[data-gi]').textContent = (idx + 1) + '/' + list.length;
  }

  async function switchGreet(delta) {
    var id = chatId();
    var chat = await CV.db.get('chats', id);
    var role = chat && chat.cast && chat.cast[0];
    var list = (role && role.greetings) || [];
    if (!list.length) return;
    var msgs = await CV.chat.load(id);
    var first = null;
    for (var i = 0; i < msgs.length; i++) if (msgs[i].role === 'assistant') { first = msgs[i]; break; }
    var idx = first ? Math.max(0, list.indexOf(first.content)) : 0;
    idx = (idx + delta + list.length) % list.length;
    if (first) { first.content = list[idx]; first.alts = [list[idx]]; first.altIdx = 0; await CV.db.put('messages', first); }
    else await CV.chat.append(id, 'assistant', list[idx]);
    toast('开场白 ' + (idx + 1) + '/' + list.length);
    CV.ui.route('chat/' + id);
    setTimeout(function () { if (window.__cvTavern) window.__cvTavern.renderFloors(true); }, 900);
  }

  /* ==================================================================
   * 四、卡片按钮桥：iframe 里点击 → 主页面动作
   * ================================================================== */
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (!d.__cvTap) return;
    var input = document.getElementById('input');
    if (d.action === 'input' && input) {
      input.value = String(d.text || '');
      input.dispatchEvent(new Event('input'));
      input.focus();
      toast('已填入输入框');
    } else if (d.action === 'send' && input) {
      input.value = String(d.text || '');
      input.dispatchEvent(new Event('input'));
      var send = document.getElementById('send');
      if (send) send.click();
    } else if (d.action === 'var') {
      var id = chatId();
      CV.db.get('chats', id).then(function (c) {
        if (!c) return;
        c.vars = c.vars || {};
        c.vars[d.key] = d.value;
        CV.db.put('chats', c).then(function () {
          if (window.__cvTavern) window.__cvTavern.renderFloors(true);
        });
      });
    } else if (d.action === 'toast') {
      toast(d.text || '');
    }
  });

  // 注入到卡片 iframe 的点击拦截脚本
  window.__cvTapShim = '<scr' + 'ipt>(function(){' +
    'document.addEventListener("click",function(ev){' +
    'var el=ev.target.closest("[data-send],[data-input],[data-var],[data-value],[data-action]");' +
    'if(!el)return;' +
    'var send=el.getAttribute("data-send"), inp=el.getAttribute("data-input");' +
    'var vk=el.getAttribute("data-var"), vv=el.getAttribute("data-value");' +
    'try{' +
    'if(send){parent.postMessage({__cvTap:1,action:"send",text:send},"*");}' +
    'else if(inp){parent.postMessage({__cvTap:1,action:"input",text:inp},"*");}' +
    'else if(vk){parent.postMessage({__cvTap:1,action:"var",key:vk,value:vv},"*");}' +
    'else{parent.postMessage({__cvTap:1,action:"input",text:(el.textContent||"").trim()},"*");}' +
    '}catch(e){}' +
    '},true);' +
    '})();<' + '/scr' + 'ipt>';

  /* ==================================================================
   * 五、同步
   * ================================================================== */
  var t = null;
  function sync() {
    clearTimeout(t);
    t = setTimeout(function () {
      try { ensureSettingsTabs(); } catch (e) {}
      try { ensureGreetPager(); } catch (e) {}
    }, 180);
  }
  window.addEventListener('hashchange', sync);
  var app = document.getElementById('app');
  if (app) new MutationObserver(sync).observe(app, { childList: true, subtree: false });
  setInterval(function () { if (isSettings() || chatId()) sync(); }, 1600);
  sync();

  window.__cvUI10 = {
    openPresetEditor: openPresetEditor,
    ensureSettingsTabs: ensureSettingsTabs,
    switchGreet: switchGreet,
    PARAM_DEFS: PARAM_DEFS
  };
})();

</script>
<script id="cv-tavern2-script">
/* ============================================================================
 * 角色宇宙 · 增强包 v11 · 酒馆工作台
 * 一、酒馆助手（ST API 兼容层）：TavernHelper / triggerSlash / sendMessage / 变量
 * 二、独立「酒馆」页：小白X / 酒馆助手 / 楼层 / 变量 / 宏 / 画布 / 舞台 / 费用
 * 三、整页画布：全屏 iframe 跑卡内 HTML+JS
 * 四、舞台：按发言人切背景、播卡内音乐
 * 五、费用估算：按 DeepSeek 价格算每条回复
 * ========================================================================== */
(function () {
  'use strict';
  var CV = window.__CV;
  if (!CV || window.__cvTavern2) return;
  window.__cvTavern2 = true;

  function g(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function s2(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(m, ms) { try { CV.ui.toast(m, ms || 2400); } catch (e) {} }
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function chatId() { var m = location.hash.match(/^#\/chat\/(.+)$/); return m ? decodeURIComponent(m[1]) : null; }
  function uid(p) { return CV.ui.uid(p || ''); }

  function sheet(title, body) {
    var wrap = document.createElement('div');
    wrap.className = 'overlay';
    wrap.innerHTML = '<div class="sheet"><div class="cv-sheet-head"><h3>' + esc(title) + '</h3>' +
      '<button class="icon-btn" data-xb style="width:32px;height:32px;font-size:20px">×</button></div><div data-bb>' + (body || '') + '</div></div>';
    (document.getElementById('modal-root') || document.body).appendChild(wrap);
    var api = { el: wrap, body: wrap.querySelector('[data-bb]'), close: function () { wrap.remove(); } };
    wrap.addEventListener('click', function (e) { if (e.target === wrap) api.close(); });
    wrap.querySelector('[data-xb]').onclick = api.close;
    return api;
  }

  /* ==================================================================
   * 一、ST API 兼容层（注入到每个卡片 iframe）
   * ================================================================== */
  var ST_SHIM = [
    '<scr' + 'ipt>(function(){',
    '  var VARS = {};',
    '  function post(m){ try{ parent.postMessage(Object.assign({__cvST:1}, m), "*"); }catch(e){} }',
    '  window.addEventListener("message", function(e){',
    '    var d = e.data || {}; if (!d.__cvvars) return; VARS = d.__cvvars || {};',
    '  });',
    '  function getVar(k){ return VARS[k]; }',
    '  function setVar(k,v){ VARS[k]=v; post({type:"setvar",key:k,value:v}); }',
    '  window.getVariables = function(){ return VARS; };',
    '  window.replaceVariables = function(t){ return String(t||"").replace(/\\{\\{\\s*getvar::\\s*([^}]+)\\}\\}/g, function(m,k){ var v=getVar(k.trim()); return v==null?"":v; }); };',
    '  window.setChatMessages = function(){};',
    '  window.sendMessage = function(t){ post({type:"send", text:String(t||"")}); };',
    '  window.triggerSlash = function(cmd){',
    '    var c = String(cmd||"").trim();',
    '    var m = c.match(/^\\/(send|sys|setvar|addvar|echo|input)\\s*([\\s\\S]*)$/i);',
    '    if (!m) { post({type:"slash", cmd:c}); return; }',
    '    var k = m[1].toLowerCase(), arg = m[2].trim();',
    '    if (k==="send"||k==="sys") post({type:"send", text:arg});',
    '    else if (k==="input") post({type:"input", text:arg});',
    '    else if (k==="echo") post({type:"toast", text:arg});',
    '    else if (k==="setvar"||k==="addvar"){',
    '      var mm = arg.split("=");',
    '      if (mm.length>=2) post({type: k==="setvar"?"setvar":"addvar", key:mm[0].trim(), value:mm.slice(1).join("=").trim()});',
    '    }',
    '  };',
    '  window.TavernHelper = {',
    '    getVariables: window.getVariables, setVariables: function(o){ Object.keys(o||{}).forEach(function(k){ setVar(k,o[k]); }); },',
    '    triggerSlash: window.triggerSlash, sendMessage: window.sendMessage,',
    '    getLastMessageId: function(){ return 0; },',
    '    formatAsTavernRegexedString: function(s){ return s; },',
    '    substituteParams: window.replaceVariables',
    '  };',
    '  window.SillyTavern = { getContext: function(){ return { variables: VARS, chat: [] }; } };',
    '  window.eventSource = { on: function(){}, off: function(){}, emit: function(){} };',
    '  document.addEventListener("click", function(ev){',
    '    var el = ev.target.closest("[data-send],[data-input],[data-var],[data-value],[data-action],button,a");',
    '    if (!el) return;',
    '    var send=el.getAttribute("data-send"), inp=el.getAttribute("data-input");',
    '    var vk=el.getAttribute("data-var"), vv=el.getAttribute("data-value");',
    '    var oc = el.getAttribute("onclick") || "";',
    '    if (send) post({type:"send", text:send});',
    '    else if (inp) post({type:"input", text:inp});',
    '    else if (vk) post({type:"setvar", key:vk, value:vv});',
    '    else if (/triggerSlash|sendMessage/.test(oc)) { /* 交给内联脚本 */ }',
    '    else if (el.tagName === "BUTTON") post({type:"input", text:(el.textContent||"").trim()});',
    '  }, true);',
    '})();<' + '/scr' + 'ipt>'
  ].join('\n');

  /* ==================================================================
   * 二、主页面处理 iframe 消息
   * ================================================================== */
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (!d.__cvST) return;
    var input = document.getElementById('input');
    if (d.type === 'input' && input) {
      input.value = String(d.text || '');
      input.dispatchEvent(new Event('input'));
      input.focus();
      toast('已填入输入框');
    } else if (d.type === 'send') {
      if (!input) return;
      input.value = String(d.text || '');
      input.dispatchEvent(new Event('input'));
      var send = document.getElementById('send');
      if (send) send.click();
    } else if (d.type === 'toast') {
      toast(d.text || '');
    } else if (d.type === 'setvar' || d.type === 'addvar') {
      var id = chatId();
      CV.db.get('chats', id).then(function (c) {
        if (!c) return;
        c.vars = c.vars || {};
        if (d.type === 'setvar') c.vars[d.key] = d.value;
        else c.vars[d.key] = String(Number(c.vars[d.key] || 0) + Number(d.value || 0));
        return CV.db.put('chats', c).then(function () {
          if (window.__cvTavern) window.__cvTavern.renderFloors(true);
        });
      });
    } else if (d.type === 'slash') {
      var cmd = String(d.cmd || '');
      if (/^\/music\s+/.test(cmd)) {
        playMusic(cmd.replace(/^\/music\s+/, ''));
      }
    }
  });

  /* 把当前变量推给 iframe */
  function pushVars(frame, vars) {
    try { frame.contentWindow.postMessage({ __cvvars: vars || {} }, '*'); } catch (e) {}
  }

  /* ==================================================================
   * 三、舞台与音乐
   * ================================================================== */
  var stageEl = null, audioEl = null;
  function stageCfg() { return Object.assign({ on: false, bg: '', blur: 0, dim: .35 }, g('cv.stage.v1', {})); }
  function saveStage(p) { var c = Object.assign(stageCfg(), p || {}); s2('cv.stage.v1', c); applyStage(); return c; }

  function applyStage() {
    var c = stageCfg();
    var id = chatId();
    if (!c.on || !id) { if (stageEl) { stageEl.remove(); stageEl = null; } document.body.classList.remove('cv-stage-on'); return; }
    if (!stageEl) {
      stageEl = document.createElement('div');
      stageEl.id = 'cvStage';
      stageEl.className = 'cv-stage';
      stageEl.innerHTML = '<i></i><b></b>';
      document.body.insertBefore(stageEl, document.body.firstChild);
    }
    var img = stageEl.querySelector('i'), dim = stageEl.querySelector('b');
    img.style.backgroundImage = c.bg ? 'url("' + c.bg + '")' : 'none';
    img.style.filter = 'blur(' + (c.blur || 0) + 'px)';
    dim.style.background = 'rgba(0,0,0,' + (c.dim != null ? c.dim : .35) + ')';
    document.body.classList.add('cv-stage-on');
  }

  function playMusic(url) {
    if (!url) return;
    try {
      if (!audioEl) { audioEl = document.createElement('audio'); audioEl.loop = true; audioEl.style.display = 'none'; document.body.appendChild(audioEl); }
      audioEl.src = String(url).trim();
      audioEl.play().catch(function () { toast('浏览器拦截了自动播放，点一下页面再试'); });
      toast('正在播放卡内音乐');
    } catch (e) {}
  }

  function openStagePanel() {
    var c = stageCfg();
    var s = sheet('舞台', '');
    s.body.innerHTML =
      '<div class="cv-note">视觉小说模式：按说话人切换背景，卡里用 <code>triggerSlash("/music 链接")</code> 播音乐。</div>' +
      '<label class="cv-check"><input type="checkbox" id="cvStageOn"' + (c.on ? ' checked' : '') + '> 启用舞台背景</label>' +
      '<div class="cv-label">背景图</div>' +
      '<div class="row" style="gap:8px;flex-wrap:wrap">' +
      '<button class="btn sm" id="cvStagePick">选本地图片</button>' +
      '<button class="btn sm" id="cvStageUrl">用网址</button>' +
      '<button class="btn sm danger" id="cvStageClear">清除</button></div>' +
      '<div class="cv-label">模糊 <span class="cv-dim" id="cvSv">' + c.blur + '</span></div>' +
      '<input type="range" id="cvStageBlur" min="0" max="24" step="1" value="' + c.blur + '">' +
      '<div class="cv-label">压暗 <span class="cv-dim" id="cvDv">' + Math.round((c.dim || 0) * 100) + '%</span></div>' +
      '<input type="range" id="cvStageDim" min="0" max="0.85" step="0.05" value="' + (c.dim || 0) + '">' +
      '<div class="cv-label">音乐</div>' +
      '<div class="row" style="gap:8px"><input class="input" id="cvMusic" placeholder="音乐链接 mp3/ogg"><button class="btn sm" id="cvMusicGo">播放</button></div>' +
      '<div class="sheet foot"><button class="btn primary" id="cvStageSave">保存</button></div>';
    s.body.querySelector('#cvStageOn').onchange = function (e) { saveStage({ on: e.target.checked }); };
    s.body.querySelector('#cvStagePick').onclick = function () {
      var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = function () {
        var f = inp.files && inp.files[0]; if (!f) return;
        var fr = new FileReader();
        fr.onload = function () { saveStage({ bg: String(fr.result), on: true }); s.close(); openStagePanel(); toast('背景已设置'); };
        fr.readAsDataURL(f);
      };
      inp.click();
    };
    s.body.querySelector('#cvStageUrl').onclick = async function () {
      var u = await CV.ui.prompt('背景图网址', '', 'https://…');
      if (u) { saveStage({ bg: String(u).trim(), on: true }); s.close(); openStagePanel(); }
    };
    s.body.querySelector('#cvStageClear').onclick = function () { saveStage({ bg: '', on: false }); s.close(); openStagePanel(); };
    var bl = s.body.querySelector('#cvStageBlur');
    bl.oninput = function () { s.body.querySelector('#cvSv').textContent = bl.value; saveStage({ blur: Number(bl.value) }); };
    var di = s.body.querySelector('#cvStageDim');
    di.oninput = function () { s.body.querySelector('#cvDv').textContent = Math.round(di.value * 100) + '%'; saveStage({ dim: Number(di.value) }); };
    s.body.querySelector('#cvMusicGo').onclick = function () { playMusic(s.body.querySelector('#cvMusic').value); };
    s.body.querySelector('#cvStageSave').onclick = function () { s.close(); };
  }

  /* ==================================================================
   * 四、整页画布
   * ================================================================== */
  function openCanvas() {
    var id = chatId();
    if (!id) { toast('先进一个对话'); return; }
    CV.db.get('chats', id).then(function (chat) {
      var role = chat && chat.cast && chat.cast[0];
      var theme = (role && role.theme) || {};
      if (!theme.html) { toast('这个角色没有可用的 HTML'); return; }
      CV.chat.load(id).then(function (msgs) {
        var last = msgs.filter(function (m) { return m.role === 'assistant'; }).pop();
        var body = String((last && last.content) || '').replace(/<UpdateVariable[\s\S]*?<\/UpdateVariable>/gi, '');
        var html = theme.html.replace(/\{\{\s*(message|mes|content)\s*\}\}|\{\s*(message|mes|content)\s*\}/g, esc(body));
        var doc = '<!doctype html><meta charset="utf-8">' +
          '<style>html,body{margin:0;background:#0b0d12;color:#e8ebf4;font:15px/1.8 system-ui}' + (theme.css || '') + '</style>' +
          html + ST_SHIM;
        var wrap = document.createElement('div');
        wrap.className = 'cv-canvas';
        wrap.innerHTML = '<div class="cv-canvas-bar"><span>整页画布 · 卡内脚本可运行</span><span style="flex:1"></span>' +
          '<button class="chip cv-chip-sm" data-cvclose>关闭</button></div><iframe sandbox="allow-scripts"></iframe>';
        document.body.appendChild(wrap);
        var f = wrap.querySelector('iframe');
        f.srcdoc = doc;
        f.onload = function () { pushVars(f, chat.vars || {}); };
        wrap.querySelector('[data-cvclose]').onclick = function () { wrap.remove(); };
        document.body.classList.add('cv-canvas-on');
        wrap.addEventListener('click', function (e) { if (e.target === wrap) { wrap.remove(); document.body.classList.remove('cv-canvas-on'); } });
        var close = function () { wrap.remove(); document.body.classList.remove('cv-canvas-on'); };
        wrap.querySelector('[data-cvclose]').onclick = close;
      });
    });
  }

  /* ==================================================================
   * 五、费用估算
   * ================================================================== */
  // DeepSeek 官方价（元 / 百万 token），高峰/低谷
  // 渲染器设置（对应酒馆助手 → 渲染器）
  function rdCfg() {
    return Object.assign({ on: true, fold: true, loading: true, blob: false, depth: 3 }, g('cv.renderer.v1', {}));
  }
  function saveRd(p) { var c = Object.assign(rdCfg(), p || {}); s2('cv.renderer.v1', c); return c; }
  window.__cvRenderer = rdCfg;

  // 资源镜像：解决 raw.githubusercontent.com 访问不了
  var MIRRORS = [
    { k: '', n: '直连（不换）' },
    { k: 'https://ghproxy.net', n: 'ghproxy.net' },
    { k: 'https://gcore.jsdelivr.net', n: 'jsdelivr gcore' },
    { k: 'https://testingcf.jsdelivr.net', n: 'jsdelivr testingcf' },
    { k: 'https://gh-proxy.com', n: 'gh-proxy.com' }
  ];
  function mirrorCfg() { return g('cv.mirror.v1', ''); }
  window.__cvMirrorGet = mirrorCfg;
  window.__cvMirrorSet = function (v) { s2('cv.mirror.v1', v || ''); };

  var PRICE = {
    'deepseek-chat': { inP: 2, outP: 8, inO: 1, outO: 2 },
    'deepseek-reasoner': { inP: 4, outP: 16, inO: 2, outO: 4 }
  };
  function isOffPeak() {
    // 官方低谷：北京时间 00:30–08:30
    var h = new Date().getHours(), m = new Date().getMinutes();
    var t = h * 60 + m;
    return t >= 30 && t <= 510;
  }
  function priceOf(model) {
    var m = String(model || '');
    for (var k in PRICE) if (m.indexOf(k) >= 0) return PRICE[k];
    return PRICE['deepseek-chat'];
  }
  function estCost(inTok, outTok, model) {
    var p = priceOf(model), off = isOffPeak();
    var inP = off ? p.inO : p.inP, outP = off ? p.outO : p.outP;
    return (inTok / 1e6) * inP + (outTok / 1e6) * outP;
  }
  function feeCfg() { return Object.assign({ on: true, warn: 0 }, g('cv.fee.v1', {})); }

  // 记账：每次请求结束后记录
  var origFetch = window.fetch.bind(window);
  if (!window.__cvFeeHook) {
    window.__cvFeeHook = true;
    window.fetch = async function (input, init) {
      var url = typeof input === 'string' ? input : (input && input.url) || '';
      if (!/chat\/completions/.test(url) || !init || typeof init.body !== 'string') return origFetch(input, init);
      var payload = null;
      try { payload = JSON.parse(init.body); } catch (e) { payload = null; }
      var res = await origFetch(input, init);
      if (!payload) return res;
      try {
        var text = '';
        var clone = res.clone ? res.clone() : null;
        if (clone) text = await clone.text();
        var inTok = Math.round((payload.messages || []).reduce(function (a, m) { return a + String(m.content || '').length; }, 0) / 1.6);
        var outTok = Math.round(text.length / 1.6);
        var cost = estCost(inTok, outTok, payload.model);
        if (feeCfg().on) addFee(cost, inTok, outTok, payload.model);
      } catch (e) {}
      return res;
    };
  }

  function addFee(cost, inTok, outTok, model) {
    var id = chatId() || 'global';
    var all = g('cv.fee.log', {});
    var cur = all[id] || { total: 0, turns: 0, last: 0 };
    cur.total += cost;
    cur.turns += 1;
    cur.last = cost;
    cur.inTok = (cur.inTok || 0) + inTok;
    cur.outTok = (cur.outTok || 0) + outTok;
    cur.model = model;
    all[id] = cur;
    s2('cv.fee.log', all);
    var cfg = feeCfg();
    if (cfg.warn && cur.last >= cfg.warn) toast('这一条约 ¥' + cur.last.toFixed(4) + '，超过提醒线', 3500);
  }

  }

  // 远程脚本加载：ESM import 失败时给出可读提示
  window.__cvLoadCardScripts = async function (scripts) {
    if (!scripts || !scripts.length) return;
    var loaded = 0, failed = [];
    for (var i = 0; i < scripts.length; i++) {
      var sc = scripts[i];
      if (sc.enabled === false) continue;
      var src = String(sc.content || '').trim();
      var m = src.match(/^import\s+['"]([^'"]+)['"]/);
      if (!m) continue;
      var url = m[1];
      try {
        await import(/* @vite-ignore */ url);
        loaded++;
      } catch (e) {
        failed.push(url);
      }
    }
    if (loaded) toast('已加载 ' + loaded + ' 个脚本');
    if (failed.length) {
      toast('有 ' + failed.length + ' 个脚本加载失败（网络或跨域限制）', 4000);
      console.warn('[scripts] 加载失败', failed);
    }
    if (!loaded && !failed.length) toast('这些脚本不是远程模块，或已禁用');
  };
