<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>角色宇宙</title><script>(function(){var bad=null;try{new Function("var a=null;return a??1")()}catch(e){bad="??"}if(!bad){try{new Function("var o={a:1};return o?.a")()}catch(e){bad="?."}}if(!bad&&!(window.indexedDB)){bad="indexedDB"}if(!bad){try{new Function("return async function(){}")()}catch(e){bad="async"}}if(bad){document.write(String.fromCharCode(60)+"div style="+String.fromCharCode(34)+"position:fixed;inset:0;background:#0b0d12;color:#e8ebf4;padding:24px;font:15px/1.8 system-ui;z-index:9999"+String.fromCharCode(34)+">这个浏览器的内核太旧了，跑不动这个页面。<br><br>缺少的能力：<b>"+bad+"</b><br><br>换一台手机或电脑打开这个网址就行。你的角色数据存在原来那台设备的浏览器里。<"+"/div>")}})();</script>
<style>
:root{
  --bg:#0b0d12; --bg2:#11141c; --panel:#161a24; --panel2:#1d2230;
  --line:#262c3b; --text:#e8ebf4; --dim:#98a0b3; --dim2:#6b7385;
  --acc:#6d8cff; --acc2:#9b7bff; --ok:#3ecf8e; --warn:#f5a524; --bad:#f04d5e;
  --r:14px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  overscroll-behavior:none;
}
#app{min-height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:none}
input,textarea,select{font:inherit;color:var(--text)}
input[type=range]{accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc)}
a{color:var(--acc);text-decoration:none}
::-webkit-scrollbar{width:0;height:0}

/* ---------- 通用 ---------- */
.screen{flex:1;display:flex;flex-direction:column;min-height:100dvh}
.pad{padding:16px}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
  background:linear-gradient(180deg,rgba(11,13,18,.96),rgba(11,13,18,.82));
  backdrop-filter:blur(12px);border-bottom:1px solid rgba(38,44,59,.6)
}
.topbar h1{font-size:17px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;color:var(--dim);flex:none}
.icon-btn:active{background:var(--panel2)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);
  font-size:14px;font-weight:500;color:var(--text);cursor:pointer;transition:.15s
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(240,77,94,.3)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--dim)}
.field .hint{font-size:12px;color:var(--dim2);line-height:1.45}
.input,.textarea,.select{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;outline:none;font-size:14px
}
.input:focus,.textarea:focus,.select:focus{border-color:rgba(109,140,255,.6)}
.textarea{resize:vertical;min-height:84px;line-height:1.55}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--dim)}
.small{font-size:12.5px}
.hr{height:1px;background:var(--line);margin:16px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.chip{
  display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;
  background:var(--panel2);color:var(--dim);font-size:12px;border:1px solid var(--line)
}
.chip.on{background:rgba(109,140,255,.16);border-color:rgba(109,140,255,.45);color:#c3d0ff}
.empty{padding:48px 20px;text-align:center;color:var(--dim2);font-size:14px}
.empty .big{display:block;font-size:34px;margin-bottom:10px;opacity:.7}

/* ---------- 首页 ---------- */
.hero{padding:calc(env(safe-area-inset-top,0px) + 24px) 18px 6px}
.hero h2{font-size:24px;font-weight:700;letter-spacing:.5px}
.hero p{color:var(--dim);font-size:13px;margin-top:4px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px}
.mode{
  position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);
  background:linear-gradient(150deg,var(--panel2),var(--panel));padding:16px 14px;min-height:112px;
  display:flex;flex-direction:column;justify-content:space-between;cursor:pointer
}
.mode:active{transform:scale(.98)}
.mode .emoji{font-size:24px}
.mode b{font-size:15.5px;display:block;margin-top:8px}
.mode span{font-size:12px;color:var(--dim);line-height:1.4;display:block;margin-top:3px}
.mode::after{content:"";position:absolute;right:-24px;top:-24px;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,rgba(109,140,255,.25),transparent 70%)}
.section-title{display:flex;align-items:center;gap:8px;padding:10px 18px 6px;font-size:13px;color:var(--dim);font-weight:600}
.section-title .spacer{flex:1}
.recent{display:flex;flex-direction:column;gap:8px;padding:0 16px 24px}
.recent-item{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.avatar{width:40px;height:40px;border-radius:12px;object-fit:cover;background:var(--panel2);flex:none;display:grid;place-items:center;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:52px;height:52px;border-radius:15px}

/* ---------- 聊天 ---------- */
.chat-body{flex:1;overflow-y:auto;padding:12px 12px 88px;display:flex;flex-direction:column;gap:10px;position:relative}
.chat-bg{position:absolute;inset:0;background-size:cover;background-position:center 18%;filter:blur(22px) brightness(.55) saturate(.85);opacity:.35;pointer-events:none;z-index:0}
.chat-body > .msg,.chat-body > .group-block,.chat-body > .chat-empty{position:relative;z-index:1}
.msg{display:flex;gap:8px;max-width:100%}
.msg .avatar{width:34px;height:34px;border-radius:10px;margin-top:2px}
.msg .bubble{
  max-width:calc(100% - 50px);padding:10px 13px;border-radius:15px;font-size:14.5px;
  white-space:pre-wrap;word-break:break-word;line-height:1.6
}
.msg.user{flex-direction:row-reverse}
.msg.user .bubble{background:linear-gradient(135deg,#3d55c9,#5b46c9);border-bottom-right-radius:5px}
.msg.assistant .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg .name{font-size:11.5px;color:var(--dim);margin:0 0 3px 2px}
.msg.streaming .bubble::after{content:"▍";animation:blink 1s steps(2) infinite;color:var(--acc)}
@keyframes blink{50%{opacity:0}}
.chat-empty{margin:auto;text-align:center;color:var(--dim2);font-size:13.5px;padding:30px}
.chat-empty .big{font-size:38px;display:block;margin-bottom:10px;opacity:.6}
.composer{
  position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;
  padding:8px 10px calc(8px + var(--safe-b));
  background:linear-gradient(180deg,rgba(11,13,18,.5),rgba(11,13,18,.97) 35%);
  backdrop-filter:blur(10px);border-top:1px solid rgba(38,44,59,.5)
}
.composer .textarea{min-height:44px;max-height:132px;border-radius:22px;padding:11px 15px;resize:none}
.send{
  width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff
}
.send.stop{background:linear-gradient(135deg,#e2555f,#b03a49)}
.send[disabled]{opacity:.4;pointer-events:none}

/* ---------- 列表 ---------- */
.list{display:flex;flex-direction:column;gap:10px;padding:12px 16px 24px}
.list-item{display:flex;gap:12px;align-items:center;padding:12px;border-radius:15px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.list-item:active{background:var(--panel2)}
.list-item .grow{flex:1;min-width:0}
.list-item .title{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .sub{font-size:12px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 世界 ---------- */
.world-head{padding:14px 16px 6px}
.world-head h2{font-size:19px}
.world-head p{color:var(--dim);font-size:13px;margin-top:4px;white-space:pre-wrap}
.char-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px 16px 24px}
.char-card{position:relative;border-radius:16px;overflow:hidden;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.char-card .pic{width:100%;aspect-ratio:3/4;display:block;object-fit:cover;background:var(--panel2)}
.char-card .meta{padding:9px 10px}
.char-card .meta b{font-size:14px;display:block}
.char-card .meta span{font-size:11.5px;color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.char-card .sel{position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.35)}
.char-card.selected{outline:2px solid var(--acc);outline-offset:-2px}
.char-card.selected .sel{background:var(--acc);border-color:var(--acc)}

/* ---------- 人生模拟 ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.stat span{font-size:11px;color:var(--dim);display:block}
.stat b{font-size:16px;font-weight:600;display:block;margin-top:2px}

/* ---------- 弹层 ---------- */
#modal-root{position:fixed;inset:0;z-index:100;pointer-events:none}
.overlay{position:fixed;z-index:200;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;pointer-events:auto;animation:fade .18s}
.sheet{
  width:100%;max-height:88dvh;overflow-y:auto;background:var(--bg2);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  padding:16px 16px calc(18px + var(--safe-b));animation:up .22s
}
.sheet h3{font-size:16px;margin-bottom:14px}
.sheet .foot{display:flex;gap:10px;margin-top:18px}
.sheet .foot .btn{flex:1}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.toast{
  position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%) translateY(8px);
  background:rgba(28,33,45,.98);border:1px solid var(--line);border-radius:12px;
  padding:10px 16px;font-size:13.5px;max-width:86vw;opacity:0;pointer-events:none;transition:.2s;z-index:200;text-align:center
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 美化面板 */
.beauty-frame{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column}
.beauty-frame .bar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:var(--bg2)}
.beauty-frame iframe{flex:1;width:100%;border:0;background:#000}
/* 战斗 */
.battle{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 20%,#1a1430,#07080c 70%);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(14px + var(--safe-b))}
.battle .fighters{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
.fighter{flex:1;text-align:center}
.fighter .pic{width:88px;height:112px;border-radius:12px;margin:0 auto;display:block;object-fit:cover;background:var(--panel2)}
.fighter b{display:block;font-size:13px;margin-top:6px}
.hp{height:7px;border-radius:4px;background:#2a2f40;margin-top:6px;overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#43d17a,#9de24f);transition:width .3s}
.hp.ai i{background:linear-gradient(90deg,#ff5d6c,#ff9a5a)}
.battle-log{flex:1;overflow-y:auto;margin:12px 0;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--dim)}
.battle-log p{background:rgba(255,255,255,.04);border-radius:10px;padding:7px 10px}
.battle-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ---------- 亮色主题 ---------- */
:root[data-theme="light"]{
  --bg:#f4f5f9; --bg2:#ffffff; --panel:#ffffff; --panel2:#eef0f6;
  --line:#dfe3ec; --text:#161a22; --dim:#5d6472; --dim2:#8b93a3;
  --acc:#4a67e0; --acc2:#7a5ae0;
}
:root[data-theme="light"] .topbar{background:linear-gradient(180deg,rgba(244,245,249,.97),rgba(244,245,249,.85))}
:root[data-theme="light"] .composer{background:linear-gradient(180deg,rgba(244,245,249,.5),rgba(244,245,249,.97) 35%)}
:root[data-theme="light"] .msg.assistant .bubble{background:#fff}
:root[data-theme="light"] .mode{background:linear-gradient(150deg,#fff,#f2f4fa)}
:root[data-theme="light"] .toast{background:#fff;color:#161a22}
:root[data-theme="light"] .beauty-frame,.beauty-frame iframe{background:#111}

/* 立绘部位热区 */
#zones{position:absolute;inset:0}
.pzone{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;
  padding:0;border-radius:9px;cursor:pointer;
  background:transparent;
  border:1px dashed rgba(150,170,255,.65);
  color:#e6ecff;font-size:9.5px;line-height:1;letter-spacing:.5px;
  backdrop-filter:blur(0);
  transition:background .15s,border-color .15s;
  overflow:visible;white-space:nowrap;
}
.pzone span{background:rgba(12,16,28,.78);padding:2px 5px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pzone:active,.pzone:hover{background:rgba(109,140,255,.28);border-color:rgba(190,205,255,.95)}

/* 立绘状态条 */
.pstate-bar{display:flex;gap:8px;overflow-x:auto;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));background:#0f131c;border-top:1px solid var(--line)}
.pstate{position:relative;flex:none;width:62px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2);display:flex;flex-direction:column}
.pstate img{width:100%;height:78px;object-fit:cover;display:block}
.pstate span{font-size:10px;padding:2px 0 4px;color:var(--dim)}
.pstate-add{justify-content:center;align-items:center;min-height:98px;border-style:dashed;color:var(--dim)}
.pstate-add span{font-size:20px;line-height:1}
.pstate-add i{font-style:normal;font-size:10px;padding-bottom:4px}
.beauty-frame .bar .btn{padding:6px 10px;font-size:13px;white-space:nowrap;flex:none}

</style>
</head>

<style id="cv-plus-style">
/* ===== 角色宇宙 · 增强包样式 ===== */
:root{
  --cv-fs:14.5px; --cv-lh:1.6; --cv-bw:calc(100% - 50px);
}
.msg .bubble{font-size:var(--cv-fs);line-height:var(--cv-lh);max-width:var(--cv-bw)}
.msg.narrative .bubble{font-size:var(--cv-fs);line-height:var(--cv-lh)}
.cv-no-motion *{animation:none !important;transition:none !important}

/* 输入区工具条 */
.cv-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.cv-chip{padding:5px 10px;font-size:12px;line-height:1.3;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.cv-count{font-size:11.5px;color:var(--dim2);white-space:nowrap}
body:has(.cv-bar) .chat-body{padding-bottom:118px}

/* 弹层内通用 */
.cv-label{font-size:12.5px;color:var(--dim);margin:12px 0 6px}
.cv-dim{color:var(--dim2);font-size:12px;font-weight:400}
.cv-note{font-size:12.5px;color:var(--dim2);line-height:1.6;margin:8px 0}
.cv-empty{padding:22px 8px;text-align:center;color:var(--dim2);font-size:13px}
.cv-inputwrap{margin-bottom:10px}
.cv-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);margin:12px 0 0}
.cv-rows{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto;-webkit-overflow-scrolling:touch}
.cv-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.cv-row:active{transform:scale(.995)}
.cv-row.on{border-color:rgba(109,140,255,.55);background:rgba(109,140,255,.12)}
.cv-row-name{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-tag{font-size:11px;color:#9fb2ff;border:1px solid rgba(109,140,255,.45);border-radius:999px;padding:1px 7px}
.cv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cv-tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:left}
.cv-tile b{font-size:13.5px}
.cv-tile span{font-size:11.5px;color:var(--dim2)}
.cv-kv{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid rgba(38,44,59,.5);font-size:13.5px;color:var(--dim)}
.cv-kv b{color:var(--text)}
.cv-hit{padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.cv-hit-top{display:flex;justify-content:space-between;font-size:12px;color:var(--dim2);margin-bottom:4px}
.cv-hit-txt{font-size:13px;line-height:1.55;color:var(--text);word-break:break-word}
.cv-hit mark{background:rgba(109,140,255,.28);color:#dfe6ff;border-radius:3px;padding:0 2px}
.cv-results{max-height:56vh;overflow:auto}

/* 设置页卡片 */
.cv-card{margin:14px 0;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.cv-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.cv-card-head b{font-size:14px}
.cv-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* 服务商 */
.cv-prov{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px}
.cv-prov.on{border-color:rgba(109,140,255,.55)}
.cv-prov-name{font-size:13.5px}
.cv-ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:56vw}

@media (min-width:760px){
  .cv-grid{grid-template-columns:1fr 1fr 1fr}
}

/* ===== 第二波 ===== */
.cv-swipe{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 6px}
.cv-swipe-btn{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;color:var(--dim);font-size:15px;line-height:1}
.cv-swipe-btn:active{background:var(--line)}
.cv-swipe-idx{font-size:11.5px;color:var(--dim2);min-width:28px;text-align:center}
.cv-swipe-row{display:flex;align-items:center;gap:8px;margin:6px 0 2px 42px;flex-wrap:wrap}
.cv-off{opacity:.45}
.cv-pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;line-height:1.65;color:var(--dim);max-height:44vh;overflow:auto;font-family:ui-monospace,Menlo,monospace}

/* ===== 第三波 ===== */
.cv-mood{position:relative;z-index:1;display:flex;align-items:center;gap:8px;margin:2px 0 4px 42px;padding:5px 10px;border-radius:999px;background:rgba(22,26,36,.86);border:1px solid var(--line);font-size:11.5px;color:var(--dim)}
.cv-mood-dot{width:7px;height:7px;border-radius:50%;flex:none}
.cv-mood-label{white-space:nowrap}
.cv-mood-bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;cursor:pointer;min-width:40px}
.cv-mood-bar i{display:block;height:100%;border-radius:2px;transition:width .3s}
.cv-mood-num{font-size:11px;color:var(--dim2);min-width:20px;text-align:right}
.cv-mood-mini{width:20px;height:20px;display:grid;place-items:center;border-radius:50%;color:var(--dim2);font-size:12px}
.cv-mood-mini:active{background:var(--line)}
.cv-mood-chart{display:flex;align-items:flex-end;gap:3px;height:90px;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;margin-top:10px}
.cv-mood-chart i{flex:1;border-radius:3px 3px 0 0;min-width:4px;opacity:.85}
.cv-drop{position:fixed;inset:12px;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed rgba(109,140,255,.6);border-radius:22px;background:rgba(11,13,18,.86);color:var(--text);font-size:16px;pointer-events:none;backdrop-filter:blur(6px)}
.cv-drop small{color:var(--dim2);font-size:12px}

</style>

  function modelCache() { return LS.get(K.models, {}); }
  function cachedModels(baseUrl) {
    var c = modelCache()[baseUrl || settings().baseUrl || ''];
    return c && c.ids ? c.ids : [];
  }
  function cacheModels(baseUrl, ids) {
    var c = modelCache();
    c[baseUrl || settings().baseUrl || ''] = { ts: Date.now(), ids: ids.slice() };
    LS.set(K.models, c);
  }
  window.__cvModelsCached = function (base, ids) {
    try { cacheModels(base, ids || []); renderSettingsCards(); } catch (e) {}
  };
  function recents() { return LS.get(K.recent, []); }
  function pushRecent(id) {
    if (!id) return;
    var r = recents().filter(function (x) { return x !== id; });
    r.unshift(id);
    LS.set(K.recent, r.slice(0, 8));
  }

  /* ----------------------------- 服务商档案 ----------------------------- */
  function providers() { return LS.get(K.providers, []); }
  function saveProviders(list) { LS.set(K.providers, list); }
  function providerFor(baseUrl) {
    var b = String(baseUrl || '').replace(/\/+$/, '');
    return providers().filter(function (p) { return String(p.base || '').replace(/\/+$/, '') === b; })[0] || null;
  }
  function applyProvider(p) {
    if (!p) return;
    saveSettings({ baseUrl: p.base || '', apiKey: p.key || '', model: p.model || settings().model });
    LS.set(K.providerCur, p.id);
    toast('已切换到「' + (p.name || p.base) + '」');
    renderSettingsCards();
    refreshModelChip();
  }

  /* ----------------------------- 当前对话参数 ----------------------------- */
  function currentChat() { return state.chat; }
  function chatOv() { return (state.chat && state.chat.ov) || {}; }
  async function patchOv(patch) {
    if (!state.chatId) return null;
    var chat = await CV.db.get('chats', state.chatId);
    if (!chat) return null;
    var ov = Object.assign({}, chat.ov || {});
    Object.keys(patch).forEach(function (k) {
      if (patch[k] === null || patch[k] === undefined || patch[k] === '') delete ov[k];
      else ov[k] = patch[k];
    });
    if (!Object.keys(ov).length) delete chat.ov; else chat.ov = ov;
    await CV.db.put('chats', chat);
    state.chat = chat;
    state.ov = chat.ov || null;
    return chat.ov || null;
  }

  /* 注入宿主 it() 的取值钩子 */
  window.__cvHook = {
    model: function () { var o = chatOv(); return o.model || null; },
    temp: function () { var o = chatOv(); return (o.temperature === 0 ? 0 : (o.temperature || null)); },
    max: function () {
      var o = chatOv();
      if (o.maxTokens) return o.maxTokens;
      var n = Number((CV.settings() || {}).maxTokens) || 0;
      // 旧的小值（<=4000）自动提到 8192，避免长剧情被截断
      return n >= 4096 ? n : 8192;   // 4096+ 尊重用户设置，32768+ 由底层省略该参数
    }
  };

  /* ----------------------------- 阅读体验 ----------------------------- */
  function look() { return Object.assign({}, DEFAULTS_LOOK, LS.get(K.look, {})); }
  function applyLook() {
    var L = look();
    var root = document.documentElement;
    root.style.setProperty('--cv-fs', L.fs + 'px');
    root.style.setProperty('--cv-lh', String(L.lh));
    root.style.setProperty('--cv-bw', L.bw >= 100 ? 'calc(100% - 50px)' : L.bw + '%');
    root.style.setProperty('--cv-motion', L.motion ? '' : '0');
    document.body.classList.toggle('cv-no-motion', !L.motion);
    window.__cvNoFollow = !L.follow ? false : window.__cvNoFollow;
  }

  /* ----------------------------- 聊天页 UI ----------------------------- */
  function chatIdFromHash() {
    var m = location.hash.match(/^#\/chat\/(.+)$/);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function ensureChatBar() {
    var composer = $('.composer');
    if (!composer) return;
    var bar = document.getElementById('cvChatBar');
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'cvChatBar';
      bar.className = 'cv-bar';
      var first = composer.firstElementChild;
      composer.insertBefore(bar, first);
    }
    if (!bar.dataset.built) {
      bar.dataset.built = '1';
      bar.innerHTML =
        '<button class="chip cv-chip" id="cvModelChip" title="切换模型">◇ <span data-model>模型</span></button>' +
        '<button class="chip cv-chip" id="cvParamChip" title="对话参数">🎛 <span data-param>参数</span></button>' +
        '<button class="chip cv-chip" id="cvToolChip" title="工具">🧰 工具</button>' +
        '<span style="flex:1"></span>' +
        '<span class="cv-count" id="cvCount"></span>';
      bar.querySelector('#cvModelChip').onclick = openModelSheet;
      bar.querySelector('#cvParamChip').onclick = openParamSheet;
      bar.querySelector('#cvToolChip').onclick = openToolSheet;
    }
    refreshModelChip();
    refreshCount();
  }

  function refreshModelChip() {
    var chip = document.getElementById('cvModelChip');
    if (!chip) return;
    var st = settings();
    var ov = chatOv();
    var name = ov.model || st.model || 'deepseek-chat';
    var span = chip.querySelector('[data-model]');
    if (span) {
      var label = name.length > 22 ? name.slice(0, 20) + '…' : name;
      if (span.textContent !== label) span.textContent = label;
    }
    chip.classList.toggle('on', !!ov.model);
    chip.title = (ov.model ? '本对话固定：' + ov.model : '全局模型：' + name) + '\n点击切换';
    var pc = document.getElementById('cvParamChip');
    if (pc) {
      var bits = [];
      if (ov.temperature !== undefined) bits.push('T' + ov.temperature);
      if (ov.maxTokens) bits.push(ov.maxTokens + 't');
      var ptxt = bits.length ? bits.join(' · ') : '参数';
      var pspan = pc.querySelector('[data-param]');
      if (pspan && pspan.textContent !== ptxt) pspan.textContent = ptxt;
      pc.classList.toggle('on', bits.length > 0);
    }
  }

  function refreshCount() {
    var input = document.getElementById('input');
    var box = document.getElementById('cvCount');
    if (!input || !box) return;
    var v = input.value || '';
    var txt = !v.trim() ? '' : (v.length + ' 字 · 约 ' + estTokens(v) + ' tok');
    if (box.textContent !== txt) box.textContent = txt;
  }

  /* ----------------------------- 模型弹层 ----------------------------- */
  async function openModelSheet() {
    var st = settings();
    var ov = chatOv();
    var cached = cachedModels(st.baseUrl);
    var s = sheet({ title: '切换模型', html: '' });
    var onlyThis = false;

    function rows(list, q) {
      q = String(q || '').toLowerCase();
      var arr = list.filter(function (id) { return !q || id.toLowerCase().indexOf(q) >= 0; });
      if (!arr.length) return '<div class="cv-empty">没有匹配的模型</div>';
      return arr.map(function (id) {
        var on = (ov.model || st.model) === id;
        return '<div class="cv-row' + (on ? ' on' : '') + '" data-pick="' + esc(id) + '">' +
          '<span class="cv-row-name">' + esc(id) + '</span>' +
          (on ? '<span class="cv-tag">当前</span>' : '') + '</div>';
      }).join('');
    }

    function paint(q) {
      var rec = recents();
      var html = '';
      html += '<div class="cv-inputwrap"><input class="input" id="cvModelSearch" placeholder="搜索模型，例如 r1 / pro / turbo" value="' + esc(q || '') + '"></div>';
      if (!cached.length) {
        html += '<div class="cv-note">还没有缓存模型列表。点下面的「拉取模型」从当前服务商取一次，之后就一直能切。</div>';
      } else {
        if (!q && rec.length) {
          html += '<div class="cv-label">最近使用</div><div class="cv-rows">' + rows(rec, '') + '</div>';
        }
        html += '<div class="cv-label">全部模型 <span class="cv-dim">' + cached.length + '</span></div><div class="cv-rows" id="cvModelRows">' + rows(cached, q) + '</div>';
      }
      html += '<label class="cv-check"><input type="checkbox" id="cvOnlyThis"' + (onlyThis ? ' checked' : '') + '> 只对这个对话生效</label>';
      html += '<div class="sheet foot"><button class="btn" id="cvPull">拉取模型</button><button class="btn" id="cvManage">服务商</button></div>';
      s.body.innerHTML = html;
      var search = s.body.querySelector('#cvModelSearch');
      search.oninput = function () { var v = search.value; paintKeep(v); };
      s.body.querySelector('#cvOnlyThis').onchange = function (e) { onlyThis = e.target.checked; };
      s.body.querySelector('#cvPull').onclick = async function () {
        var btn = this; btn.disabled = true; btn.textContent = '拉取中…';
        try {
          var ids = await CV.api.models();
          cacheModels(settings().baseUrl, ids);
          cached = ids; toast('拉到 ' + ids.length + ' 个模型'); paint('');
        } catch (e) { toast(e.message || '拉取失败', 4000); btn.disabled = false; btn.textContent = '拉取模型'; }
      };
      s.body.querySelector('#cvManage').onclick = function () { s.close(); openProviderSheet(); };
      bindPicks();
    }
    function paintKeep(q) {
      var searchVal = q;
      var sel = document.activeElement;
      paint(searchVal);
      var inp = s.body.querySelector('#cvModelSearch');
      if (inp) { inp.value = searchVal; inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {} }
    }
    function bindPicks() {
      $$('.cv-row', s.body).forEach(function (row) {
        row.onclick = async function () {
          var id = row.getAttribute('data-pick');
          if (onlyThis) { await patchOv({ model: id }); toast('本对话固定：' + id); }
          else { saveSettings({ model: id }); await patchOv({ model: null }); toast('全局模型：' + id); }
          pushRecent(id);
          s.close(); refreshModelChip();
        };
      });
    }
    paint('');
    setTimeout(function () { var i = s.body.querySelector('#cvModelSearch'); if (i) i.focus(); }, 80);
  }

  async function openParamSheet() {
    var st = settings();
    var ov = chatOv();
    var temp = ov.temperature !== undefined ? ov.temperature : Number(st.temperature);
    var max = ov.maxTokens || Number(st.maxTokens) || 8192;
    var onlyThis = ov.temperature !== undefined || !!ov.maxTokens;
    var s = sheet({
      title: '对话参数', html:
        '<div class="cv-label">温度 <span class="cv-dim" id="cvTVal">' + temp + '</span></div>' +
        '<input type="range" id="cvTemp" min="0" max="2" step="0.1" value="' + temp + '" style="width:100%">' +
        '<div class="cv-label" style="margin-top:14px">单次回复上限</div>' +
        '<input class="input" id="cvMax" type="number" min="100" max="32768" step="128" value="' + max + '">' +
        '<div class="cv-note">温度越高越发散；上限 1 个汉字约 1.5 token。</div>' +
        '<label class="cv-check"><input type="checkbox" id="cvOnly"' + (onlyThis ? ' checked' : '') + '> 只对这个对话生效</label>' +
        '<div class="sheet foot"><button class="btn ghost" id="cvReset">恢复全局</button><button class="btn primary" id="cvSaveParam">保存</button></div>'
    });
    s.body.querySelector('#cvTemp').oninput = function (e) { s.body.querySelector('#cvTVal').textContent = e.target.value; };
    s.body.querySelector('#cvReset').onclick = async function () {
      await patchOv({ temperature: null, maxTokens: null });
      s.close(); refreshModelChip(); toast('已恢复全局参数');
    };
    s.body.querySelector('#cvSaveParam').onclick = async function () {
      var t = Number(s.body.querySelector('#cvTemp').value);
      var m = Math.max(100, Math.min(32768, Math.round(Number(s.body.querySelector('#cvMax').value) || 8192)));
      if (s.body.querySelector('#cvOnly').checked) { await patchOv({ temperature: t, maxTokens: m }); toast('本对话：T' + t + ' / ' + m + 't'); }
      else { saveSettings({ temperature: t, maxTokens: m }); await patchOv({ temperature: null, maxTokens: null }); toast('全局：T' + t + ' / ' + m + 't'); }
      s.close(); refreshModelChip();
    };
  }

        '<div class="cv-grid">' +
        '<button class="cv-tile" data-act="stats"><b>📊 统计</b><span>条数 / 字数 / token</span></button>' +
        '<button class="cv-tile" data-act="export"><b>⬇️ 导出</b><span>这个对话的 Markdown</span></button>' +
        '<button class="cv-tile" data-act="copyall"><b>📋 复制全文</b><span>整段对话进剪贴板</span></button>' +
        '<button class="cv-tile" data-act="search"><b>🔍 搜索</b><span>所有对话里的内容</span></button>' +
        '<button class="cv-tile" data-act="find"><b>🎯 本会话</b><span>在当前对话里找</span></button>' +
        '<button class="cv-tile" data-act="doctor"><b>🩺 数据体检</b><span>清理孤儿消息</span></button>' +

        '<button class="cv-tile" data-act="tpl"><b>📝 模板</b><span>提示词模板库</span></button>' +
        '<button class="cv-tile" data-act="import"><b>📥 导入卡</b><span>PNG / JSON 角色卡</span></button>' +
        '<button class="cv-tile" data-act="beauty"><b>🖼 美化</b><span>卡片模板渲染 / 开关</span></button>' +
        '<button class="cv-tile" data-act="regex"><b>🔧 正则</b><span>按模式改写与裁剪</span></button>' +
        '</div>'
    });
    s.body.querySelectorAll('[data-act]').forEach(function (b) {
      b.onclick = function () {

        s.close();
        if (act === 'stats') showStats();
        if (act === 'export') exportMarkdown();
        if (act === 'copyall') copyAll();
        if (act === 'search') openSearch(false);
        if (act === 'find') openSearch(true);
        if (act === 'doctor') doctor();
        if (act === 'look') openLookSheet();
        if (act === 'draft') { var d = LS.get(K.draft, {}); delete d[state.chatId]; LS.set(K.draft, d); toast('草稿已清除'); }
        if (act === 'tpl' && window.__cvPlus3) window.__cvPlus3.openTemplateSheet();
        if (act === 'import' && window.__cvPlus3) window.__cvPlus3.openImportHint();
        if (act === 'beauty' && window.__cvPlus7) window.__cvPlus7.openBeautyPanel();
        if (act === 'regex' && window.__cvPlus7) { window.__cvPlus7.openBeautyPanel(); setTimeout(function () { var b = document.querySelector('.overlay [data-tab="regex"]'); if (b) b.click(); }, 200); }
      };
    });
  }

  async function showStats() {
    if (!state.chat) return;
    var msgs = await CV.chat.load(state.chatId);
    var chars = msgs.reduce(function (a, m) { return a + String(m.content || '').length; }, 0);
    var mine = msgs.filter(function (m) { return m.role === 'user'; });
    var ai = msgs.filter(function (m) { return m.role === 'assistant'; });
    var sys = CV.chat.prompt(state.chat, '');
    var s = sheet({
      title: '会话统计', html:
        '<div class="cv-kv"><span>消息</span><b>' + msgs.length + ' 条</b></div>' +
        '<div class="cv-kv"><span>你 / 角色</span><b>' + mine.length + ' / ' + ai.length + '</b></div>' +
        '<div class="cv-kv"><span>正文字数</span><b>' + fmtNum(chars) + '</b></div>' +
        '<div class="cv-kv"><span>估算 token</span><b>' + fmtNum(estTokens(msgs.map(function (m) { return m.content; }).join(''))) + '</b></div>' +
        '<div class="cv-kv"><span>系统提示</span><b>' + fmtNum(sys.length) + ' 字</b></div>' +
        '<div class="cv-kv"><span>角色数</span><b>' + (state.chat.cast || []).length + '</b></div>' +
        '<div class="cv-kv"><span>最近更新</span><b>' + hhmm(state.chat.updatedAt) + '</b></div>'
    });
  }

  async function exportMarkdown() {
    if (!state.chat) return;
    var chat = state.chat, msgs = await CV.chat.load(state.chatId);
    var names = {};
    (chat.cast || []).forEach(function (c) { names[c.name] = c.name; });
    var lines = ['# ' + (chat.title || '对话'), '', '> 导出时间：' + new Date().toLocaleString('zh-CN') + '　模式：' + (chat.mode || 'catbox'), ''];
    msgs.forEach(function (m) {
      if (m.role === 'system') return;
      lines.push(m.role === 'user' ? '**' + (settings().userName || '你') + '**：' : '**' + ((chat.cast && chat.cast[0] && chat.cast[0].name) || '角色') + '**：');
      lines.push('', String(m.content || ''), '');
    });
    var name = String(chat.title || '对话').replace(/[\\/:*?"<>|]/g, '_') + '.md';
    var blob = new Blob([lines.join('\n')], { type: 'text/markdown;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
    toast('已导出 ' + name);
  }

  async function copyAll() {
    if (!state.chat) return;
    var msgs = await CV.chat.load(state.chatId);
    var text = msgs.filter(function (m) { return m.role !== 'system'; })
      .map(function (m) { return (m.role === 'user' ? '我：' : '角色：') + m.content; }).join('\n\n');
    try { await navigator.clipboard.writeText(text); toast('已复制 ' + text.length + ' 字'); }
    catch (e) { toast('复制失败，长按输入框手动粘贴'); }
  }

  function openSearch(localOnly) {
    var s = sheet({
      title: localOnly ? '在本会话里搜' : '搜索所有对话', html:
        '<div class="cv-inputwrap"><input class="input" id="cvQ" placeholder="输入关键词"></div>' +
        '<div id="cvResults" class="cv-results"><div class="cv-empty">输入关键词开始搜</div></div>'
    });
    var input = s.body.querySelector('#cvQ');
    var box = s.body.querySelector('#cvResults');
    var timer = null;
    async function run() {
      var q = input.value.trim();
      if (!q) { box.innerHTML = '<div class="cv-empty">输入关键词开始搜</div>'; return; }
      box.innerHTML = '<div class="cv-empty">搜索中…</div>';
      var msgs = await CV.db.all('messages');
      if (localOnly) msgs = msgs.filter(function (m) { return m.chatId === state.chatId; });
      var chats = await CV.db.all('chats');
      var cmap = {}; chats.forEach(function (c) { cmap[c.id] = c; });
      var hits = msgs.filter(function (m) { return String(m.content || '').toLowerCase().indexOf(q.toLowerCase()) >= 0; })
        .sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); }).slice(0, 60);
      if (!hits.length) { box.innerHTML = '<div class="cv-empty">没找到「' + esc(q) + '」</div>'; return; }
      box.innerHTML = hits.map(function (m, i) {
        var c = cmap[m.chatId];
        var title = c ? (c.title || '对话') : '（已删除的对话）';
        var idx = String(m.content).toLowerCase().indexOf(q.toLowerCase());
        var pre = String(m.content).slice(Math.max(0, idx - 40), idx);
        var hit = String(m.content).slice(idx, idx + q.length);
        var post = String(m.content).slice(idx + q.length, idx + q.length + 60);
        return '<div class="cv-hit" data-i="' + i + '" data-chat="' + esc(m.chatId) + '">' +
          '<div class="cv-hit-top"><span>' + esc(title) + '</span><span class="cv-dim">' + hhmm(m.ts) + '</span></div>' +
          '<div class="cv-hit-txt">' + esc(pre) + '<mark>' + esc(hit) + '</mark>' + esc(post) + '</div></div>';
      }).join('');
      $$('.cv-hit', box).forEach(function (el) {
        el.onclick = function () { s.close(); CV.ui.route('chat/' + el.getAttribute('data-chat')); };
      });
    }
    input.oninput = function () { clearTimeout(timer); timer = setTimeout(run, 180); };
    setTimeout(function () { input.focus(); }, 80);
  }

  async function doctor() {
    var chats = await CV.db.all('chats');
    var msgs = await CV.db.all('messages');
    var ids = {}; chats.forEach(function (c) { ids[c.id] = c; });
    var orphan = msgs.filter(function (m) { return !ids[m.chatId]; });
    if (orphan.length) {
      var ok = await CV.ui.confirm('发现 ' + orphan.length + ' 条消息属于已删除的对话，清理掉？', '清理');
      if (ok) { for (var i = 0; i < orphan.length; i++) await CV.db.del('messages', orphan[i].id); }
    }
    var fixed = 0;
    for (var j = 0; j < chats.length; j++) {
      var c = chats[j];
      var list = msgs.filter(function (m) { return m.chatId === c.id; });
      var last = list.length ? list[list.length - 1] : null;
      var want = last ? String(last.content || '').slice(0, 80) : '';
      if ((c.preview || '') !== want || !c.updatedAt) {
        c.preview = want;
        c.updatedAt = last ? last.ts : (c.updatedAt || Date.now());
        await CV.db.put('chats', c); fixed++;
      }
    }
    toast('体检完成：清理 ' + orphan.length + ' 条，修复 ' + fixed + ' 个会话');
  }

  function openLookSheet() {
    var L = look();
    var s = sheet({
      title: '阅读体验', html:
        '<div class="cv-label">正文字号 <span class="cv-dim" id="cvFsVal">' + L.fs + 'px</span></div>' +

        '<div class="cv-label" style="margin-top:12px">气泡宽度 <span class="cv-dim" id="cvBwVal">' + L.bw + '%</span></div>' +

    });
    function bind() {
      s.body.querySelector('#cvFs').oninput = function (e) { s.body.querySelector('#cvFsVal').textContent = e.target.value + 'px'; };
      s.body.querySelector('#cvLh').oninput = function (e) { s.body.querySelector('#cvLhVal').textContent = e.target.value; };
      s.body.querySelector('#cvBw').oninput = function (e) { s.body.querySelector('#cvBwVal').textContent = e.target.value + '%'; };
    }
    bind();
    s.body.querySelector('#cvLookReset').onclick = function () { LS.set(K.look, DEFAULTS_LOOK); applyLook(); s.close(); toast('已恢复默认阅读设置'); };
    s.body.querySelector('#cvLookSave').onclick = function () {
      LS.set(K.look, {
        fs: Number(s.body.querySelector('#cvFs').value),
        lh: Number(s.body.querySelector('#cvLh').value),
        bw: Number(s.body.querySelector('#cvBw').value),
        motion: s.body.querySelector('#cvMotion').checked,
        follow: s.body.querySelector('#cvFollow').checked
      });
      applyLook(); s.close(); toast('已保存');
    };
  }

  /* ----------------------------- 设置页增强 ----------------------------- */
  var cardSigs = {};
  function renderSettingsCards() {
    var pad = $('.pad');
    if (!pad || !/^#\/settings/.test(location.hash)) { cardSigs = {}; return; }
    var modelField = document.getElementById('model');
    if (modelField && !document.getElementById('cvModelCard')) {
      var card = document.createElement('div');
      card.id = 'cvModelCard';
      card.className = 'cv-card';
      modelField.closest('.field').insertAdjacentElement('afterend', card);
    }
    if (document.getElementById('cvModelCard')) paintModelCard();

    if (!document.getElementById('cvLookCard')) {
      var look = document.createElement('div');
      look.id = 'cvLookCard';
      look.className = 'cv-card';
      var anchor = null;
      $$('.section-title', pad).forEach(function (t) { if (/外观/.test(t.textContent) && !anchor) anchor = t; });
      if (anchor) anchor.insertAdjacentElement('beforebegin', look);
      else pad.appendChild(look);
    }
    paintLookCard();

    if (!document.getElementById('cvV4Card')) {
      var v4 = document.createElement('div');
      v4.id = 'cvV4Card';
      v4.className = 'cv-card';
      var lookAnc = document.getElementById('cvLookCard');
      var host = lookAnc ? lookAnc : null;
      if (host) host.insertAdjacentElement('beforebegin', v4); else pad.appendChild(v4);
      v4.innerHTML =
        '<div class="cv-card-head"><b>外观与预设</b><span class="cv-dim">主题 · 气泡 · 背景</span></div>' +
        '<div class="cv-note">8 套主题、6 种气泡、透明度、背景图（支持动图）。预设决定 AI 怎么写。</div>' +
        '<div class="row" style="gap:8px;flex-wrap:wrap">' +
        '<button class="btn sm" id="cvV4Skin">🎨 外观与主题</button>' +
        '<button class="btn sm" id="cvV4Preset">🎭 预设库</button>' +
        '<button class="btn sm" id="cvV4Chats">💬 全部会话</button></div>';
      v4.querySelector('#cvV4Skin').onclick = function () { if (window.__cvPlus4) window.__cvPlus4.openSkinSheet(); };
      v4.querySelector('#cvV4Preset').onclick = function () { if (window.__cvPlus4) window.__cvPlus4.openPresetSheet(); };
      v4.querySelector('#cvV4Chats').onclick = function () { CV.ui.route('chats'); };
    }

    if (!document.getElementById('cvMaintCard')) {
      var m = document.createElement('div');
      m.id = 'cvMaintCard';
      m.className = 'cv-card';
      var sa = null;
      $$('.section-title', pad).forEach(function (t) { if (/存档/.test(t.textContent) && !sa) sa = t; });
      if (sa) sa.insertAdjacentElement('beforebegin', m);
      else pad.appendChild(m);
    }
    paintMaintCard();
  }

  function paintModelCard() {
    var card = document.getElementById('cvModelCard');
    if (!card) return;
    var st = settings();
    var sig0 = (st.baseUrl || '') + '|' + (st.model || '') + '|' + cachedModels(st.baseUrl).length + '|' + ((providerFor(st.baseUrl) || {}).name || '');
    if (cardSigs.model === sig0 && card.dataset.painted) return;
    cardSigs.model = sig0;
    card.dataset.painted = '1';
    var base = st.baseUrl || 'https://api.deepseek.com';
    var cached = cachedModels(st.baseUrl);
    var rec = modelCache()[st.baseUrl || ''] || null;
    var p = providerFor(st.baseUrl);
    card.innerHTML =
      '<div class="cv-card-head"><b>模型中心</b><span class="cv-dim">' + (p ? esc(p.name) : '当前服务商') + '</span></div>' +
      '<div class="cv-note">' + (cached.length
        ? '已缓存 <b>' + cached.length + '</b> 个模型' + (rec ? '（' + new Date(rec.ts).toLocaleDateString('zh-CN') + ' 更新）' : '')
        : '还没有缓存模型列表，拉取一次就不用每次去设置里重新获取了') + '</div>' +
      '<div class="cv-chips">' +
      (cached.slice(0, 6).map(function (id) {
        return '<button class="chip' + (id === st.model ? ' on' : '') + '" data-m="' + esc(id) + '">' + esc(id) + '</button>';
      }).join('') || '') +
      '</div>' +
      '<div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap">' +
      '<button class="btn sm" id="cvPull2">拉取模型</button>' +
      '<button class="btn sm" id="cvAllModels">全部模型</button>' +
      '<button class="btn sm" id="cvProviders">服务商</button>' +
      '</div>';
    $$('[data-m]', card).forEach(function (b) {
      b.onclick = function () {
        saveSettings({ model: b.getAttribute('data-m') });
        var inp = document.getElementById('model'); if (inp) inp.value = b.getAttribute('data-m');
        cardSigs.model = '';
        paintModelCard(); toast('全局模型：' + b.getAttribute('data-m'));
      };
    });
    var pull = card.querySelector('#cvPull2');
    if (pull) pull.onclick = async function () {
      pull.disabled = true; pull.textContent = '拉取中…';
      try {
        var ids = await CV.api.models();
        cacheModels(settings().baseUrl, ids);
        cardSigs.model = '';
        toast('拉到 ' + ids.length + ' 个模型'); paintModelCard();
      } catch (e) { toast(e.message || '拉取失败', 4000); pull.disabled = false; pull.textContent = '拉取模型'; }
    };
    var all = card.querySelector('#cvAllModels');
    if (all) all.onclick = function () {
      var s = sheet({ title: '全部模型', html: '' });
      var list = cachedModels(settings().baseUrl);
      s.body.innerHTML = list.length
        ? list.map(function (id) { return '<div class="cv-row' + (id === settings().model ? ' on' : '') + '" data-pick="' + esc(id) + '"><span class="cv-row-name">' + esc(id) + '</span></div>'; }).join('')
        : '<div class="cv-note">还没有缓存，先点「拉取模型」。</div>';
      $$('[data-pick]', s.body).forEach(function (r) {
        r.onclick = function () {
          saveSettings({ model: r.getAttribute('data-pick') });
          var inp = document.getElementById('model'); if (inp) inp.value = r.getAttribute('data-pick');
          s.close(); paintModelCard(); toast('已切换');
        };
      });
    };
    var pv = card.querySelector('#cvProviders');
    if (pv) pv.onclick = openProviderSheet;
  }

  function paintLookCard() {
    var card = document.getElementById('cvLookCard');
    if (!card) return;
    var L = look();
    var sigL = L.fs + '|' + L.lh + '|' + L.bw;
    if (cardSigs.look === sigL && card.dataset.painted) return;
    cardSigs.look = sigL;
    card.dataset.painted = '1';
    card.innerHTML =
      '<div class="cv-card-head"><b>阅读体验</b><span class="cv-dim">' + L.fs + 'px · 行距 ' + L.lh + '</span></div>' +
      '<div class="cv-note">字号、行距、气泡宽度，改完立刻生效。</div>' +
      '<button class="btn sm" id="cvLookOpen">调整</button>';
    card.querySelector('#cvLookOpen').onclick = openLookSheet;
  }

  function paintMaintCard() {
    var card = document.getElementById('cvMaintCard');
    if (!card) return;
    var snap = LS.get(K.snap, null);
    var sigM = (snap && snap.day ? snap.day + '|' + (snap.size || 0) : 'none');
    if (cardSigs.maint === sigM && card.dataset.painted) return;
    cardSigs.maint = sigM;
    card.dataset.painted = '1';
    card.innerHTML =
      '<div class="cv-card-head"><b>维护</b><span class="cv-dim">' + (snap && snap.day ? '上次快照 ' + snap.day : '没有快照') + '</span></div>' +
      '<div class="cv-note">数据体检会清理已删除对话的残留消息；每日快照把角色/世界/会话存一份到浏览器里，防手滑。</div>' +
      '<div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn sm" id="cvDoctor">数据体检</button>' +
      '<button class="btn sm" id="cvSnap">立即快照</button></div>';
    card.querySelector('#cvDoctor').onclick = doctor;
    card.querySelector('#cvSnap').onclick = function () { takeSnapshot(true); };
  }

  /* ----------------------------- 服务商面板 ----------------------------- */
  function openProviderSheet() {
    var s = sheet({ title: '服务商', html: '' });
    function paint() {
      var list = providers();
      var cur = LS.get(K.providerCur, '');
      var st = settings();
      var html = '<div class="cv-note">把常用的接口存成档案，一键切换。档案存在本机浏览器里。</div>';
      html += list.length ? list.map(function (p) {
        var on = p.id === cur || String(p.base || '').replace(/\/+$/, '') === String(st.baseUrl || '').replace(/\/+$/, '');
        return '<div class="cv-prov' + (on ? ' on' : '') + '" data-id="' + esc(p.id) + '">' +
          '<div style="flex:1;min-width:0"><div class="cv-prov-name">' + esc(p.name || p.base) + '</div>' +
          '<div class="cv-dim cv-ellipsis">' + esc(p.base) + ' · ' + esc(p.model || '') + '</div></div>' +
          '<button class="btn sm" data-use>用这个</button>' +
          '<button class="icon-btn" data-edit style="width:30px;height:30px">✎</button>' +
          '</div>';
      }).join('') : '<div class="cv-empty">还没有档案</div>';
      html += '<div class="sheet foot"><button class="btn primary" id="cvProvAdd">新建档案</button></div>';
      s.body.innerHTML = html;
      $$('.cv-prov', s.body).forEach(function (row) {
        var id = row.getAttribute('data-id');
        var p = list.filter(function (x) { return x.id === id; })[0];
        row.querySelector('[data-use]').onclick = function () { applyProvider(p); s.close(); };
        row.querySelector('[data-edit]').onclick = function () { s.close(); editProvider(p); };
      });
      var add = s.body.querySelector('#cvProvAdd');
      if (add) add.onclick = function () { s.close(); editProvider(null); };
    }
    paint();
  }

  function editProvider(p) {
    var st = settings();
    var isNew = !p;
    p = p || { id: 'p_' + Date.now().toString(36), name: '', base: st.baseUrl || '', key: st.apiKey || '', model: st.model || '' };
    var s = sheet({
      title: isNew ? '新建服务商' : '编辑服务商', html:
        '<div class="cv-label">名字</div><input class="input" id="cvPn" value="' + esc(p.name) + '" placeholder="例如：DeepSeek 官方 / 某中转">' +
        '<div class="cv-label" style="margin-top:10px">API 地址</div><input class="input" id="cvPb" value="' + esc(p.base) + '" placeholder="https://api.deepseek.com">' +
        '<div class="cv-label" style="margin-top:10px">API Key</div><input class="input" id="cvPk" type="password" value="' + esc(p.key) + '" placeholder="sk-…">' +
        '<div class="cv-label" style="margin-top:10px">默认模型</div><input class="input" id="cvPm" value="' + esc(p.model) + '" placeholder="deepseek-chat">' +
        '<div class="cv-note">切到某个档案 = 把它的地址 / Key / 模型写进设置。</div>' +
        '<div class="sheet foot"><button class="btn danger" id="cvPDel">删除</button><button class="btn primary" id="cvPSave">保存</button></div>'
    });
    if (isNew) s.body.querySelector('#cvPDel').style.display = 'none';
    s.body.querySelector('#cvPDel').onclick = async function () {
      var ok = await CV.ui.confirm('删除这个服务商档案？不影响当前设置。', '删除');
      if (!ok) return;
      saveProviders(providers().filter(function (x) { return x.id !== p.id; }));
      s.close(); openProviderSheet();
    };
    s.body.querySelector('#cvPSave').onclick = function () {
      var np = {
        id: p.id,
        name: s.body.querySelector('#cvPn').value.trim() || s.body.querySelector('#cvPb').value.trim(),
        base: s.body.querySelector('#cvPb').value.trim(),
        key: s.body.querySelector('#cvPk').value.trim(),
        model: s.body.querySelector('#cvPm').value.trim()
      };
      var list = providers().filter(function (x) { return x.id !== np.id; });
      list.push(np);
      saveProviders(list);
      s.close();
      renderSettingsCards();
      toast('已保存档案');
      if (isNew) openProviderSheet();
    };
  }

  /* ----------------------------- 每日快照 ----------------------------- */
  async function takeSnapshot(manual) {
    try {
      var data = {
        day: dayKey(), ts: Date.now(),
        settings: CV.settings(),
        chars: await CV.db.all('chars'),
        worlds: await CV.db.all('worlds'),
        chats: (await CV.db.all('chats')).map(function (c) {
          var copy = {}; for (var k in c) if (k !== 'ov') copy[k] = c[k];
          return copy;
        })
      };
      var str = JSON.stringify(data);
      if (str.length > 3.5e6) { if (manual) toast('数据太大，快照跳过（' + Math.round(str.length / 1024) + 'KB）'); return; }
      LS.set(K.snap, { day: data.day, ts: data.ts, size: str.length, data: data });
      var card = document.getElementById('cvMaintCard'); if (card) paintMaintCard();
      if (manual) toast('已快照：' + Math.round(str.length / 1024) + ' KB');
    } catch (e) {
      if (manual) toast('快照失败：' + (e.message || e), 3000);
    }
  }

  /* ----------------------------- 输入增强 ----------------------------- */
  var COMMANDS = [
    { k: '/续写', d: '顺着上文往下写一段', t: '继续往下写，接着上一段的情节推进，不要重复已经写过的内容。' },
    { k: '/精简', d: '把上一条压缩变短', t: '把上一条回复压缩到三分之一，保留关键情节和台词。' },
    { k: '/扩写', d: '把上一条写得更细', t: '把上一条回复扩写两倍，补上环境、动作和神态的细节。' },
    { k: '/换个说法', d: '用另一种语气重写', t: '用另一种语气重写上一条，意思不变。' },
    { k: '/旁白', d: '写一段环境与氛围', t: '用旁白视角写一段环境和氛围，不要人物台词。' },
    { k: '/总结', d: '三句话总结目前剧情', t: '用三句话总结目前发生的剧情，再给出两个可以继续的方向。' },
    { k: '/清空', d: '清空输入框', t: '' }
  ];

  function bindInput() {
    var input = document.getElementById('input');
    if (!input || input.dataset.cvBound) return;
    input.dataset.cvBound = '1';
    var saveT = null;
    input.addEventListener('input', function () {
      refreshCount();
      clearTimeout(saveT);
      saveT = setTimeout(function () {
        var d = LS.get(K.draft, {});
        if (input.value.trim()) d[state.chatId] = input.value; else delete d[state.chatId];
        LS.set(K.draft, d);
      }, 400);
      if (input.value.charAt(0) === '/' && input.value.length <= 6 && !state.cmdOpen) openCmdSheet();
    });
    input.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        var send = document.getElementById('send');
        if (send) send.click();
      }
      if (e.key === 'Escape') {
        var sen = document.getElementById('send');
        if (sen && sen.classList.contains('stop')) sen.click();
      }
    });
    var draft = LS.get(K.draft, {})[state.chatId];
    if (draft && !input.value.trim()) { input.value = draft; CV.chat && requestAnimationFrame(function () { input.dispatchEvent(new Event('input')); }); }
    refreshCount();
  }

  function openCmdSheet() {
    state.cmdOpen = true;
    var s = sheet({ title: '快捷指令', html: COMMANDS.map(function (c) {
      return '<div class="cv-row" data-cmd="' + esc(c.k) + '"><span class="cv-row-name">' + esc(c.k) + '<span class="cv-dim"> · ' + esc(c.d) + '</span></span></div>';
    }).join('') });
    s.el.addEventListener('click', function (e) { if (e.target === s.el) state.cmdOpen = false; });
    var closeBtn = s.el.querySelector('[data-x]');
    var origClose = s.close;
    s.close = function () { state.cmdOpen = false; origClose(); };
    closeBtn.onclick = s.close;
    $$('[data-cmd]', s.body).forEach(function (r) {
      r.onclick = function () {
        var cmd = COMMANDS.filter(function (c) { return c.k === r.getAttribute('data-cmd'); })[0];
        var input = document.getElementById('input');
        s.close();
        if (!cmd || !input) return;
        input.value = cmd.t;
        input.dispatchEvent(new Event('input'));
        input.focus();
      };
    });
  }

  /* ----------------------------- 滚动跟随 ----------------------------- */
  function bindScroll() {
    var box = document.getElementById('msgs');
    if (!box || box.dataset.cvScroll) return;
    box.dataset.cvScroll = '1';
    box.addEventListener('scroll', function () {
      var gap = box.scrollHeight - box.scrollTop - box.clientHeight;
      window.__cvNoFollow = gap > 120;
    }, { passive: true });
  }

  /* ----------------------------- 路由同步 ----------------------------- */
  var syncT = null;
  function sync() {
    var id = chatIdFromHash();
    var route = id ? 'chat' : (location.hash || '#/home');
    if (id !== state.chatId) {
      state.chatId = id;
      state.chat = null;
      state.ov = null;
      if (id) loadChat(id);
    }
    state.route = route;
    applyLook();
    if (id) {
      ensureChatBar();
      bindInput();
      bindScroll();
    }
    if (/^#\/settings/.test(location.hash)) renderSettingsCards();
  }
  async function loadChat(id) {
    var chat = await CV.db.get('chats', id);
    if (chat) {
      state.chat = chat;
      state.ov = chat.ov || null;
      refreshModelChip();
    }
  }
  function scheduleSync() {
    clearTimeout(syncT);
    syncT = setTimeout(function () { try { sync(); } catch (e) { console.warn('[cv-plus] sync', e); } }, 80);
  }

  /* ----------------------------- 引导 ----------------------------- */
  function boot() {
    applyLook();
    window.addEventListener('hashchange', scheduleSync);
    window.addEventListener('popstate', scheduleSync);
    var app = document.getElementById('app');
    if (app) {
      new MutationObserver(scheduleSync).observe(app, { childList: true, subtree: true });
    }
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (t && t.id === 'loadModels') { setTimeout(renderSettingsCards, 800); }
    }, true);

    // 每日首次打开自动快照
    var snap = LS.get(K.snap, null);
    if (!snap || snap.day !== dayKey()) {
      setTimeout(function () { takeSnapshot(false); }, 4000);
    }
    LS.set(K.migrate, { at: Date.now(), v: '2.0' });
    scheduleSync();
    state.booted = true;
    console.log('%c[角色宇宙] 增强包 v2 已加载', 'color:#6d8cff');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  window.__cvPlus = {
    version: '2.0',
    openModelSheet: openModelSheet,
    openParamSheet: openParamSheet,
    openToolSheet: openToolSheet,
    openLookSheet: openLookSheet,
    openProviderSheet: openProviderSheet,
    doctor: doctor,
    snapshot: takeSnapshot,
    stats: showStats,
    search: openSearch,
    look: look,
    cacheModels: cacheModels,
    cachedModels: cachedModels,
    providers: providers
  };
})();

</script>
<script id="cv-plus2-script">
/* ============================================================================
 * 角色宇宙 · 增强包 v2 第二波
 * 消息 swipes / 多开场白 / 对话分支 / 角色卡导出(PNG+JSON) / 世界书管理
 * / 语音输入 / 群聊 @ 定向 / 提示词解剖
 * 全部为叠加层，不改原逻辑。
 * ========================================================================== */
(function () {
  'use strict';
  var CV = window.__CV;
  if (!CV || window.__cvPlus2Loaded) return;
  window.__cvPlus2Loaded = true;

  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(m, ms) { try { CV.ui.toast(m, ms || 2200); } catch (e) {} }
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function uid(p) { return CV.ui.uid(p || ''); }
  function chatId() { var m = location.hash.match(/^#\/chat\/(.+)$/); return m ? decodeURIComponent(m[1]) : null; }
  function findById(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }

  function sheetHtml(title, body) {
    var wrap = document.createElement('div');
    wrap.className = 'overlay';
    wrap.innerHTML = '<div class="sheet" role="dialog">' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">' +
      '<h3 style="flex:1;margin:0">' + esc(title) + '</h3>' +
      '<button class="icon-btn" data-x2 style="width:32px;height:32px;font-size:20px">×</button></div>' +
      body + '</div>';
    (document.getElementById('modal-root') || document.body).appendChild(wrap);
    var api = { el: wrap, body: wrap.querySelector('.sheet'), close: function () { wrap.remove(); } };
    wrap.addEventListener('click', function (e) { if (e.target === wrap) api.close(); });
    wrap.querySelector('[data-x2]').onclick = api.close;
    return api;
  }

  /* ═══════════════════ 1. 消息 swipes（多候选回复） ═══════════════════ */
  // 结构：message.alts = [content1, content2...]、message.altIdx = 当前索引
  async function ensureAlt(msg) {
    if (!msg) return null;
    if (!msg.alts || !msg.alts.length) { msg.alts = [String(msg.content || '')]; msg.altIdx = 0; }
    return msg;
  }

  function swipeBar(msg) {
    if (!msg || !msg.alts || msg.alts.length < 1) return null;
    if (msg.alts.length < 2) return null;
    var bar = document.createElement('div');
    bar.className = 'cv-swipe';
    bar.innerHTML =
      '<button class="cv-swipe-btn" data-prev title="上一版">‹</button>' +
      '<span class="cv-swipe-idx">' + ((msg.altIdx || 0) + 1) + '/' + msg.alts.length + '</span>' +
      '<button class="cv-swipe-btn" data-next title="下一版">›</button>';
    bar.querySelector('[data-prev]').onclick = function (e) { e.stopPropagation(); switchAlt(msg, -1); };
    bar.querySelector('[data-next]').onclick = function (e) { e.stopPropagation(); switchAlt(msg, 1); };
    return bar;
  }

  async function switchAlt(msg, delta) {
    await ensureAlt(msg);
    var n = msg.alts.length;
    msg.altIdx = ((msg.altIdx || 0) + delta + n) % n;
    msg.content = msg.alts[msg.altIdx];
    await CV.db.put('messages', msg);
    var id = chatId();
    if (id) {
      var chat = await CV.db.get('chats', id);
      if (chat) { chat.updatedAt = Date.now(); chat.preview = String(msg.content || '').slice(0, 80); await CV.db.put('chats', chat); }
      updateBubble(msg);
    }
  }

  // 只刷新那一条气泡的正文与版本条，不重建整页（保住草稿和滚动位置）
  function updateBubble(msg) {
    var box = document.getElementById('msgs');
    if (!box || !msg) return false;
    var nodes = $$('.msg', box);
    var list = (window.__cvMsgList && window.__cvMsgList.msgs || []).filter(function (m) { return m.role !== 'system'; });
    var idx = list.findIndex(function (m) { return m.id === msg.id; });
    if (idx < 0) return false;
    var node = nodes[idx];
    if (!node) return false;
    var txt = node.querySelector('.txt');
    if (txt) {
      // 复用宿主的 Markdown 渲染规则（**加粗** + 换行）
      var html = esc(msg.content).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
      txt.innerHTML = html;
    }
    var row = node.querySelector('.cv-swipe-row');
    var sb = swipeBar(msg);
    if (row) {
      var old = row.querySelector('.cv-swipe');
      if (sb) { if (old) old.replaceWith(sb); else row.appendChild(sb); }
      else if (old) old.remove();
    } else {
      row = document.createElement('div');
      row.className = 'cv-swipe-row';
      row.innerHTML = '<button class="chip cv-chip" data-more>↻ 再来一版</button>';
      if (sb) row.appendChild(sb);
      row.querySelector('[data-more]').onclick = function () { regenerate(msg, window.__cvMsgList.chat); };
      node.appendChild(row);
    }
    return true;
  }

  async function renderChat(app, id) {
    // 复用宿主页面重建（切换路由会重建），保留滚动位置
    var box = document.getElementById('msgs');
    var atBottom = !box || (box.scrollHeight - box.scrollTop - box.clientHeight) < 160;
    location.hash = '#/home';
    await new Promise(function (r) { setTimeout(r, 30); });
    location.hash = '#/chat/' + id;
    await new Promise(function (r) { setTimeout(r, 120); });
    if (atBottom) { var nb = document.getElementById('msgs'); if (nb) nb.scrollTop = nb.scrollHeight; }
  }

  // 给最后一条 AI 消息挂上"再来一版"按钮
  var decorateSig = '';
  async function decorateLastMessage() {
    var id = chatId();
    if (!id) return;
    var box = document.getElementById('msgs');
    if (!box) return;
    var cached = window.__cvMsgList;
    if (cached && cached.chatId === id && cached.msgs && cached.msgs.length) {
      var tail = cached.msgs[cached.msgs.length - 1];
      var sig0 = id + '|' + tail.id + '|' + ((tail.alts || []).length) + '|' + (tail.altIdx || 0);
      if (sig0 === decorateSig && box.querySelector('.cv-swipe-row')) return;
    }
    var msgs = await CV.chat.load(id);
    if (!msgs.length) return;
    var chat = await CV.db.get('chats', id);
    if (!chat) return;
    var lastAi = null;
    for (var i = msgs.length - 1; i >= 0; i--) if (msgs[i].role === 'assistant') { lastAi = msgs[i]; break; }
    if (!lastAi) return;
    await ensureAlt(lastAi);
    var nodes = $$('.msg', box);
    var target = null;
    for (var j = nodes.length - 1; j >= 0; j--) if (!nodes[j].classList.contains('user')) { target = nodes[j]; break; }
    if (!target) return;
    if (target.querySelector('.cv-swipe-row')) {
      // 已挂过，只把版本条刷新一下
      var sb0 = swipeBar(lastAi);
      var oldSb = target.querySelector('.cv-swipe');
      if (sb0 && oldSb) oldSb.replaceWith(sb0);
      else if (sb0) target.querySelector('.cv-swipe-row').appendChild(sb0);
      return;
    }
    decorateSig = id + '|' + lastAi.id + '|' + ((lastAi.alts || []).length) + '|' + (lastAi.altIdx || 0);
    var bar = document.createElement('div');
    bar.className = 'cv-swipe-row';
    bar.innerHTML = '<button class="chip cv-chip" data-more>↻ 再来一版</button>' +
      '<span class="cv-swipe" data-slot></span>';
    var slot = bar.querySelector('[data-slot]');
    var sb = swipeBar(lastAi);
    if (sb) slot.replaceWith(sb); else slot.remove();
    bar.querySelector('[data-more]').onclick = function () { regenerate(lastAi, chat); };
    target.appendChild(bar);
  }

  async function regenerate(msg, chat) {
    await ensureAlt(msg);
    var id = chat.id;
    var all = await CV.chat.load(id);
    var idx = all.findIndex(function (m) { return m.id === msg.id; });
    if (idx < 0) { toast('找不到这条消息'); return; }
    // 找到它前面最近的用户消息
    var ask = null;
    for (var i = idx - 1; i >= 0; i--) if (all[i].role === 'user') { ask = all[i]; break; }
    if (!ask) { toast('这条前面没有你的提问'); return; }
    var history = all.slice(0, idx);
    var sys = CV.chat.prompt(chat, String(ask.content || ''));
    var body = [{ role: 'system', content: sys }].concat(CV.chat.history(history));
    var input = document.getElementById('input');
    var oldPlaceholder = input ? input.placeholder : '';
    if (input) { input.placeholder = '正在生成新的版本…'; input.disabled = true; }
    toast('正在生成另一版…', 4000);
    try {
      var res = await CV.api.chat(body, {});
      var text = String(res.text || '').trim();
      if (!text) { toast('模型没有返回内容'); return; }
      msg.alts.push(text);
      msg.altIdx = msg.alts.length - 1;
      msg.content = text;
      await CV.db.put('messages', msg);
      var c2 = await CV.db.get('chats', id);
      if (c2) { c2.updatedAt = Date.now(); c2.preview = text.slice(0, 80); await CV.db.put('chats', c2); }
      if (updateBubble(msg)) toast('已生成第 ' + msg.alts.length + ' 版，用 ‹ › 切换');
      else { await renderChat(document.getElementById('app'), id); toast('已生成新版本'); }
    } catch (e) {
      toast(e.message || '生成失败', 4000);
    } finally {
      if (input) { input.placeholder = oldPlaceholder; input.disabled = false; }
    }
  }

  /* ═══════════════════ 2. 多开场白 ═══════════════════ */
  async function openGreetingSheet() {

    var chat = await CV.db.get('chats', id); if (!chat) return;
    var role = chat.cast && chat.cast[0];

    if (role && role.greeting && list.indexOf(role.greeting) < 0) list.unshift(role.greeting);
    if (!list.length) { toast('这个角色没有开场白'); return; }
    var s = sheetHtml('换一个开场', list.map(function (g, i) {
      return '<div class="cv-hit" data-g="' + i + '"><div class="cv-hit-top"><span>开场 ' + (i + 1) + '</span></div>' +
        '<div class="cv-hit-txt">' + esc(String(g).slice(0, 160)) + (String(g).length > 160 ? '…' : '') + '</div></div>';
    }).join('') +
      '<div class="cv-note">换开场会把当前对话的第一条消息替换掉，后面的消息不受影响。</div>' +
      '<div class="sheet foot"><button class="btn" id="cvAddG">把一个开场加为候选</button></div>');
    $$('[data-g]', s.body).forEach(function (el) {

        if (first) { first.content = g; first.alts = [g]; first.altIdx = 0; await CV.db.put('messages', first); }

        await renderChat(document.getElementById('app'), id);
        toast('已换开场');
      };
    });
    var addBtn = s.body.querySelector('#cvAddG');
    if (addBtn) addBtn.onclick = async function () {
      var msgs = await CV.chat.load(id);
      var first = msgs.filter(function (m) { return m.role === 'assistant'; })[0];
      if (!first) { toast('先有一条开场白'); return; }
      var text = await CV.ui.prompt('候选开场白', String(first.content || ''), '粘贴或改写一段开场', true);
      if (!text) return;
      var ch = await CV.db.get('chats', id);
      var r = ch.cast && ch.cast[0];
      if (r) {
        r.greetings = r.greetings || (r.greeting ? [r.greeting] : []);
        if (r.greetings.indexOf(text) < 0) r.greetings.push(text);
        await CV.db.put('chars', r);
      }
      s.close();
      toast('已加入候选开场');
    };

  /* ═══════════════════ 3. 对话分支 ═══════════════════ */
  async function branchFrom(msgId) {
    var id = chatId(); if (!id) return;
    var chat = await CV.db.get('chats', id); if (!chat) return;
    var msgs = await CV.chat.load(id);
    var idx = msgs.findIndex(function (m) { return m.id === msgId; });
    if (idx < 0) return;
    var keep = msgs.slice(0, idx + 1);
    var newChat = Object.assign({}, chat, {
      id: uid('ch_'),
      title: (chat.title || '对话') + ' · 分支',
      createdAt: Date.now(), updatedAt: Date.now(),
      branchFrom: id, branchAt: idx + 1,
      preview: keep.length ? String(keep[keep.length - 1].content || '').slice(0, 80) : ''
    });
    await CV.db.put('chats', newChat);
    for (var i = 0; i < keep.length; i++) {
      var m = keep[i];
      await CV.db.put('messages', {
        id: uid('m_'), chatId: newChat.id, role: m.role, content: m.content,
        ts: m.ts + i, options: m.options || undefined
      });
    }
    toast('已创建分支，共 ' + keep.length + ' 条');
    location.hash = '#/chat/' + newChat.id;
  }

  /* ═══════════════════ 4. 角色卡导出 ═══════════════════ */
  function toTavernV2(c) {
    var book = (c.lorebook || []).map(function (e) {
      return {
        keys: e.keys || [], content: e.content || '', enabled: e.enabled !== false,
        insertion_order: 0, case_sensitive: null, name: e.name || (e.keys || []).join(','),
        priority: 10, id: 0, comment: '', selective: true, secondary_keys: [],
        constant: false, position: 'before_char'
      };
    });
    return {
      spec: 'chara_card_v2', spec_version: '2.0',
      data: {
        name: c.name || '未命名角色',
        description: c.desc || '',
        personality: c.personality || '',
        scenario: c.scenario || '',
        first_mes: c.greeting || '',
        mes_example: c.mesExample || '',
        creator_notes: c.notes || '',
        system_prompt: c.system || '',
        post_history_instructions: c.postHistory || '',
        alternate_greetings: (c.greetings || []).filter(function (g) { return g && g !== c.greeting; }),
        tags: c.tags || [],
        creator: '角色宇宙',
        character_version: '1.0',
        extensions: {
          corverse: { id: c.id, seed: c.seed, gender: c.gender, avatar: c.avatar || '', userPersona: c.userPersona || '' }
        },
        character_book: book.length ? { name: (c.name || '') + ' 世界书', entries: book } : undefined
      }
    };
  }

  function download(name, blob) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }

  function exportJson(c) {
    var card = toTavernV2(c);
    var name = String(c.name || '角色').replace(/[\\/:*?"<>|]/g, '_') + '.json';
    download(name, new Blob([JSON.stringify(card, null, 2)], { type: 'application/json' }));
    toast('已导出 ' + name);
  }

  // 把 JSON 塞进 PNG 的 tEXt 块（Tavern 兼容）
  function pngWithCard(pngBytes, card) {
    var json = JSON.stringify(card);
    var b64 = btoa(unescape(encodeURIComponent(json)));
    var kw = 'chara\0';
    var data = new Uint8Array(kw.length + b64.length);
    for (var i = 0; i < kw.length; i++) data[i] = kw.charCodeAt(i);
    for (var j = 0; j < b64.length; j++) data[kw.length + j] = b64.charCodeAt(j);
    var crcTable = (function () {
      var t = new Uint32Array(256);
      for (var n = 0; n < 256; n++) { var cc = n; for (var k = 0; k < 8; k++) cc = cc & 1 ? 0xEDB88320 ^ (cc >>> 1) : cc >>> 1; t[n] = cc >>> 0; }
      return t;
    })();
    function crc32(buf) {
      var c = 0xFFFFFFFF;
      for (var i2 = 0; i2 < buf.length; i2++) c = crcTable[(c ^ buf[i2]) & 0xFF] ^ (c >>> 8);
      return (c ^ 0xFFFFFFFF) >>> 0;
    }
    function u32(n) { return new Uint8Array([(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255]); }
    var type = new Uint8Array([116, 69, 88, 116]); // tEXt
    var body = new Uint8Array(data.length);
    body.set(data);
    var crcBuf = new Uint8Array(4 + body.length);
    crcBuf.set(type, 0); crcBuf.set(body, 4);
    var chunk = new Uint8Array(4 + 4 + body.length + 4);
    chunk.set(u32(body.length), 0);
    chunk.set(type, 4);
    chunk.set(body, 8);
    chunk.set(u32(crc32(crcBuf)), 8 + body.length);
    // PNG 签名后紧跟 IHDR；在 IHDR 之后插入 tEXt（Tavern 允许任意位置，但惯例在头）
    var out = new Uint8Array(pngBytes.length + chunk.length);
    out.set(pngBytes.slice(0, 33), 0);
    out.set(chunk, 33);
    out.set(pngBytes.slice(33), 33 + chunk.length);
    return out;
  }

  async function exportPng(c) {
    try {
      var src = c.avatar || '';
      if (!src || src.indexOf('data:image') !== 0) { toast('这个角色没有可用的立绘，先到立绘工坊生成或上传一张'); return; }
      var img = new Image();
      await new Promise(function (res, rej) { img.onload = res; img.onerror = rej; img.src = src; });
      var W = 400, H = 560;
      var cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      var g = cv.getContext('2d');
      g.fillStyle = '#0b0d12'; g.fillRect(0, 0, W, H);
      var scale = Math.min(W / img.width, H / img.height);
      var dw = img.width * scale, dh = img.height * scale;
      g.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
      var blob = await new Promise(function (res) { cv.toBlob(res, 'image/png'); });
      var buf = new Uint8Array(await blob.arrayBuffer());
      var out = pngWithCard(buf, toTavernV2(c));
      var name = String(c.name || '角色').replace(/[\\/:*?"<>|]/g, '_') + '.png';
      download(name, new Blob([out], { type: 'image/png' }));
      toast('已导出 ' + name + '（酒馆可直接导入）', 3000);
    } catch (e) {
      toast('导出失败：' + (e.message || e), 4000);
    }
  }

  function openExportSheet(c) {
